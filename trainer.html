<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المدرب — أنشئ اختبارك</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --green:#0b5830; --green2:#107c41; --bg:#f6fbf8; --cream:#f5f0e1; --red:#c81e1e; --ink:#1c2b23; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  header { text-align:center; padding:22px 0 8px; }
  header .logo { display:inline-block; background:var(--green); color:var(--cream); padding:8px 22px; border-radius:40px; font-weight:bold; font-size:20px; }
  header p { color:#5a6b60; margin-top:10px; font-size:15px; }
  .card { background:#fff; border-radius:18px; box-shadow:0 4px 18px rgba(11,88,48,.08); padding:26px 22px; margin-top:20px; }
  input[type=text], input[type=email], input[type=password], textarea { width:100%; padding:12px 14px; border:2px solid #dce9e0; border-radius:12px; font-size:15px; font-family:inherit; background:var(--bg); }
  input:focus, textarea:focus { outline:none; border-color:var(--green2); }
  label { display:block; font-size:13px; color:#5a6b60; margin:12px 0 5px; font-weight:bold; }
  .btn { display:block; width:100%; background:var(--green); color:#fff; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:14px; }
  .btn2 { display:block; width:100%; background:#fff; color:var(--green); border:2px solid var(--green); border-radius:12px; padding:12px; font-size:15px; cursor:pointer; margin-top:10px; }
  .qrow { border:2px solid #e4efe8; border-radius:14px; padding:16px; margin-top:14px; background:var(--bg); }
  .qrow h4 { color:var(--green); margin-bottom:8px; }
  .opt-line { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .opt-line input[type=text] { flex:1; }
  .opt-line input[type=radio] { width:20px; height:20px; accent-color:var(--green); }
  .muted { color:#5a6b60; font-size:13px; }
  .err { background:#fbeaea; color:var(--red); border-radius:10px; padding:10px 14px; margin-top:12px; font-size:14px; display:none; }
  .ok { background:#e6f6ec; color:var(--green); border-radius:10px; padding:10px 14px; margin-top:12px; font-size:14px; display:none; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:14px; }
  th, td { padding:10px 8px; border-bottom:1px solid #e4efe8; text-align:right; }
  th { color:var(--green); }
  .quiz-item { border:2px solid #e4efe8; border-radius:14px; padding:14px 16px; margin-top:12px; cursor:pointer; }
  .quiz-item:hover { border-color:var(--green2); }
  .linkbox { direction:ltr; text-align:left; background:#eef7f1; border-radius:10px; padding:10px 12px; font-size:13px; word-break:break-all; margin-top:10px; }
  .tabs { display:flex; gap:10px; margin-bottom:6px; }
  .tabs button { flex:1; padding:10px; border:2px solid #dce9e0; background:#fff; border-radius:10px; cursor:pointer; font-size:15px; font-weight:bold; color:#5a6b60; }
  .tabs button.active { border-color:var(--green); color:var(--green); background:#eef7f1; }
  a.brand { color:var(--green); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">لوحة المدرب</span>
    <p>أنشئ اختبارك الخاص وشاركه مع طلابك وتابع نتائجهم — <a class="brand" href="index.html">العودة للاختبارات العامة</a></p>
  </header>

  <div class="card" id="auth">
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="setMode('login')">تسجيل الدخول</button>
      <button id="tabSignup" onclick="setMode('signup')">حساب جديد</button>
    </div>
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="you@example.com" style="direction:ltr;text-align:left">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="6 أحرف على الأقل">
    <button class="btn" id="authBtn" onclick="doAuth()">دخول</button>
    <div class="err" id="authErr"></div>
  </div>

  <div class="card" id="builder" style="display:none;">
    <h3 style="color:var(--green)">إنشاء اختبار جديد</h3>
    <label>عنوان الاختبار</label>
    <input type="text" id="quizTitle" placeholder="مثال: مراجعة الوحدة الثالثة">
    <div id="qlist"></div>
    <button class="btn2" onclick="addQuestion()">+ إضافة سؤال</button>
    <button class="btn" onclick="saveQuiz()">حفظ الاختبار والحصول على الرابط</button>
    <div class="err" id="buildErr"></div>
    <div class="ok" id="buildOk"></div>
    <div id="shareBox"></div>
  </div>

  <div class="card" id="dash" style="display:none;">
    <h3 style="color:var(--green)">اختباراتي ونتائج الطلاب</h3>
    <div id="quizList"></div>
    <div id="attempts"></div>
  </div>

  <div style="text-align:center;margin-top:14px;display:none;" id="signoutBox">
    <button class="btn2" style="width:auto;padding:8px 22px;" onclick="signOut()">تسجيل الخروج</button>
  </div>
</div>

<script>
const SUPA_URL = 'https://vgvkbsnpdpgybtsfwted.supabase.co';
const SUPA_KEY = 'sb_publishable_v3QgxU-WmX2vOPmIr1vJZw_qaGTHVvg';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
let mode = 'login', user = null, qCount = 0;

function setMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabSignup').classList.toggle('active', m === 'signup');
  document.getElementById('authBtn').textContent = m === 'login' ? 'دخول' : 'إنشاء الحساب';
}
function showErr(id, msg) { const e = document.getElementById(id); e.textContent = msg; e.style.display = 'block'; }
async function doAuth() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || password.length < 6) return showErr('authErr', 'أدخل بريدًا صحيحًا وكلمة مرور 6 أحرف على الأقل.');
  const btn = document.getElementById('authBtn'); btn.disabled = true;
  const r = mode === 'login'
    ? await supa.auth.signInWithPassword({ email, password })
    : await supa.auth.signUp({ email, password });
  btn.disabled = false;
  if (r.error) return showErr('authErr', mode === 'login' ? 'بيانات الدخول غير صحيحة أو الحساب غير موجود.' : ('تعذر إنشاء الحساب: ' + r.error.message));
  if (!r.data.session) return showErr('authErr', 'تم إنشاء الحساب. سجّل الدخول الآن.');
  enter(r.data.session.user);
}
function enter(u) {
  user = u;
  document.getElementById('auth').style.display = 'none';
  document.getElementById('builder').style.display = '';
  document.getElementById('dash').style.display = '';
  document.getElementById('signoutBox').style.display = '';
  if (qCount === 0) addQuestion();
  loadDashboard();
}
async function signOut() { await supa.auth.signOut(); location.reload(); }

function addQuestion() {
  qCount++;
  const n = qCount;
  const div = document.createElement('div');
  div.className = 'qrow'; div.id = 'q' + n;
  div.innerHTML = '<h4>سؤال ' + n + '</h4>'
    + '<label>نص السؤال</label><input type="text" class="qq" placeholder="اكتب السؤال">'
    + '<label>الاختيارات (حدد الصحيحة بعلامة الدائرة)</label>'
    + [0,1,2,3].map(i => '<div class="opt-line"><input type="radio" name="c' + n + '" value="' + i + '"' + (i===0?' checked':'') + '><input type="text" class="qo" placeholder="اختيار ' + (i+1) + '"></div>').join('')
    + '<label>شرح الإجابة</label><input type="text" class="qe" placeholder="لماذا هذه هي الإجابة الصحيحة؟">';
  document.getElementById('qlist').appendChild(div);
}
async function saveQuiz() {
  const title = document.getElementById('quizTitle').value.trim();
  if (!title) return showErr('buildErr', 'اكتب عنوان الاختبار أولًا.');
  const rows = [];
  for (let i = 1; i <= qCount; i++) {
    const box = document.getElementById('q' + i);
    if (!box) continue;
    const q = box.querySelector('.qq').value.trim();
    const o = [...box.querySelectorAll('.qo')].map(x => x.value.trim());
    const a = parseInt(box.querySelector('input[name=c' + i + ']:checked').value);
    const e = box.querySelector('.qe').value.trim();
    if (!q || o.some(x => !x)) return showErr('buildErr', 'أكمل نص السؤال والاختيارات الأربعة في السؤال ' + i + '.');
    rows.push({ ord: i, q, o, a, e });
  }
  if (!rows.length) return showErr('buildErr', 'أضف سؤالًا واحدًا على الأقل.');
  document.getElementById('buildErr').style.display = 'none';
  const rq = await supa.from('quizzes').insert({ title, trainer_id: user.id }).select().single();
  if (rq.error) return showErr('buildErr', 'تعذر حفظ الاختبار: ' + rq.error.message);
  const qs = await supa.from('questions').insert(rows.map(r => ({ ...r, quiz_id: rq.data.id })));
  if (qs.error) return showErr('buildErr', 'تعذر حفظ الأسئلة: ' + qs.error.message);
  const link = location.origin + location.pathname.replace('trainer.html', 'take.html') + '?quiz=' + rq.data.id;
  const ok = document.getElementById('buildOk');
  ok.textContent = 'تم حفظ الاختبار. شارك هذا الرابط مع طلابك:'; ok.style.display = 'block';
  document.getElementById('shareBox').innerHTML = '<div class="linkbox"><a href="' + link + '">' + link + '</a></div>'
    + '<button class="btn2" onclick="navigator.clipboard.writeText(\'' + link + '\');this.textContent=\'تم النسخ ✅\'">نسخ الرابط</button>';
  loadDashboard();
}
async function loadDashboard() {
  const r = await supa.from('quizzes').select('*').order('created_at', { ascending: false });
  const box = document.getElementById('quizList');
  if (!r.data || !r.data.length) { box.innerHTML = '<p class="muted" style="margin-top:10px;">لا اختبارات بعد — أنشئ أول اختبار من الأعلى.</p>'; return; }
  box.innerHTML = '';
  r.data.forEach(q => {
    const d = document.createElement('div');
    d.className = 'quiz-item';
    d.innerHTML = '<b>' + q.title + '</b> <span class="muted">— ' + new Date(q.created_at).toLocaleDateString('ar-EG') + '</span><div class="muted">اضغط لعرض نتائج الطلاب</div>';
    d.onclick = () => loadAttempts(q);
    box.appendChild(d);
  });
}
async function loadAttempts(q) {
  const r = await supa.from('attempts').select('*').eq('quiz_id', q.id).order('created_at', { ascending: false });
  const box = document.getElementById('attempts');
  const link = location.origin + location.pathname.replace('trainer.html', 'take.html') + '?quiz=' + q.id;
  let html = '<h4 style="margin-top:16px;color:var(--green)">نتائج: ' + q.title + '</h4><div class="linkbox">' + link + '</div>';
  if (!r.data || !r.data.length) html += '<p class="muted" style="margin-top:8px;">لم يحل أي طالب بعد.</p>';
  else {
    html += '<table><tr><th>الطالب</th><th>النتيجة</th><th>الوقت</th><th>التاريخ</th></tr>';
    r.data.forEach(a => {
      html += '<tr><td>' + a.student_name + '</td><td><b>' + a.score + ' من ' + a.total + '</b></td><td>' + (a.seconds ? a.seconds + ' ث' : '—') + '</td><td>' + new Date(a.created_at).toLocaleString('ar-EG') + '</td></tr>';
    });
    html += '</table>';
  }
  box.innerHTML = html;
  box.scrollIntoView({ behavior: 'smooth' });
}
(async () => {
  const s = await supa.auth.getSession();
  if (s.data.session) enter(s.data.session.user);
})();
</script>
</body>
</html>
