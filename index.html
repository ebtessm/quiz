<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبر نفسك — أسئلة تدريبية بالتصحيح الفوري</title>
<style>
  :root { --green:#0b5830; --green2:#107c41; --bg:#f6fbf8; --cream:#f5f0e1; --red:#c81e1e; --ink:#1c2b23; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  header { text-align:center; padding:22px 0 8px; }
  header .logo { display:inline-block; background:var(--green); color:var(--cream); padding:8px 22px; border-radius:40px; font-weight:bold; font-size:20px; }
  header p { color:#5a6b60; margin-top:10px; font-size:15px; }
  .card { background:#fff; border-radius:18px; box-shadow:0 4px 18px rgba(11,88,48,.08); padding:26px 22px; margin-top:20px; }
  .sec-btn { display:block; width:100%; text-align:right; background:var(--bg); border:2px solid #dce9e0; border-radius:14px; padding:18px; margin-top:14px; cursor:pointer; font-size:17px; font-weight:bold; color:var(--ink); transition:.15s; }
  .sec-btn:hover { border-color:var(--green2); background:#eef7f1; }
  .sec-btn small { display:block; font-weight:normal; color:#5a6b60; margin-top:6px; font-size:13px; }
  .meta { display:flex; justify-content:space-between; color:#5a6b60; font-size:14px; margin-bottom:14px; }
  .bar { height:8px; background:#e4efe8; border-radius:6px; overflow:hidden; margin-bottom:20px; }
  .bar div { height:100%; background:var(--green2); width:0%; transition:width .3s; }
  .q { font-size:19px; font-weight:bold; line-height:1.7; margin-bottom:18px; }
  .opt { display:block; width:100%; text-align:right; background:var(--bg); border:2px solid #dce9e0; border-radius:12px; padding:14px 16px; margin-top:10px; cursor:pointer; font-size:16px; line-height:1.6; transition:.15s; }
  .opt:hover:not(:disabled) { border-color:var(--green2); }
  .opt:disabled { cursor:default; opacity:.85; }
  .opt.right { background:#e6f6ec; border-color:var(--green2); color:var(--green); font-weight:bold; }
  .opt.wrong { background:#fbeaea; border-color:var(--red); color:var(--red); }
  .why { display:none; margin-top:16px; background:#fff8e8; border-right:4px solid #d9a400; border-radius:10px; padding:14px 16px; font-size:15px; line-height:1.8; }
  .why.show { display:block; }
  .why b { color:#8a6500; }
  .next { display:none; width:100%; margin-top:18px; background:var(--green); color:#fff; border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:bold; cursor:pointer; }
  .next.show { display:block; }
  .score-big { font-size:52px; font-weight:bold; color:var(--green); text-align:center; }
  .score-sub { text-align:center; color:#5a6b60; margin:10px 0 18px; font-size:16px; }
  .again { display:block; width:100%; background:var(--green); color:#fff; border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:10px; }
  .ghost { display:block; width:100%; background:#fff; color:var(--green); border:2px solid var(--green); border-radius:12px; padding:13px; font-size:16px; cursor:pointer; margin-top:10px; }
  footer { text-align:center; color:#8a9a90; font-size:13px; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">اختبر نفسك</span>
    <p>أسئلة تدريبية بالتصحيح الفوري وشرح الإجابة — للمدارس والشغل</p>
  </header>

  <div class="card" id="home">
    <div style="font-size:17px;font-weight:bold;">اختر القسم:</div>
    <button class="sec-btn" onclick="start('computing')">💻 حاسب آلي وتكنولوجيا<small>أساسيات الكمبيوتر والإنترنت والأمان وإكسل والبرمجة والاختبار — 50 سؤال</small></button>
    <button class="sec-btn" onclick="start('arabic')">🕌 لغة عربية<small>نحو وصرف وإملاء ومعانٍ — 50 سؤال</small></button>
    <button class="sec-btn" onclick="start('english')">🇬🇧 لغة إنجليزية<small>قواعد ومفردات أساسية — 55 سؤال</small></button>
    <button class="sec-btn" onclick="start('general')">🌍 اختبارات عامة<small>ثقافة عامة: جغرافيا وعلوم وتاريخ ورياضة — 50 سؤال</small></button>
    <button class="sec-btn" onclick="start('behavioral')">💼 انترفيوهات ومهارات سلوكية<small>مواقف العمل والمقابلات الشخصية والتواصل وإدارة الوقت — 50 سؤال</small></button>
  </div>

  <div class="card" id="quiz" style="display:none;">
    <div class="meta"><span id="counter"></span><span id="running"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <button class="next" id="nextbtn" onclick="next()"></button>
  </div>

  <div class="card" id="result" style="display:none;">
    <div class="score-big" id="scorenum"></div>
    <div class="score-sub" id="scoremsg"></div>
    <button class="again" onclick="restart(true)">إعادة نفس القسم</button>
    <button class="ghost" onclick="restart(false)">اختيار قسم آخر</button>
  </div>

  <div style="text-align:center;margin-top:22px;"><a href="trainer.html" style="color:var(--green);font-weight:bold;">هل أنت مدرب؟ أنشئ اختبارًا لطلابك من هنا</a></div>
  <footer>نسخة تجريبية للتعلم الذاتي، وليست اختبارًا رسميًا. إجابات المواقف السلوكية إرشادية وقد تختلف حسب السياق.</footer>
</div>

<script>
const BANKS = {"computing": [{"q": "ما وظيفة وحدة المعالجة المركزية (CPU) في الكمبيوتر؟", "o": ["تخزين الملفات بشكل دائم", "تنفيذ التعليمات ومعالجة البيانات", "عرض الصور على الشاشة", "الاتصال بالإنترنت"], "a": 1, "e": "الـ CPU هي عقل الكمبيوتر: تنفذ التعليمات وتعالج البيانات. التخزين الدائم وظيفة القرص الصلب، والعرض وظيفة كارت الشاشة."}, {"q": "أي مما يلي يعتبر ذاكرة مؤقتة تفقد محتواها عند إطفاء الجهاز؟", "o": ["القرص الصلب HDD", "ذاكرة الوصول العشوائي RAM", "الفلاش ميموري", "القرص SSD"], "a": 1, "e": "الـ RAM ذاكرة مؤقتة سريعة تعمل أثناء تشغيل الجهاز فقط وتُمسح عند إطفائه، عكس وسائط التخزين الدائمة."}, {"q": "ما الفرق الأساسي بين نظام التشغيل والبرنامج التطبيقي؟", "o": ["لا يوجد فرق", "نظام التشغيل يدير موارد الجهاز ويشغّل البرامج، والتطبيق يؤدي مهمة محددة للمستخدم", "نظام التشغيل للألعاب فقط", "التطبيق يعمل بدون نظام تشغيل"], "a": 1, "e": "نظام التشغيل (مثل Windows) هو الوسيط الذي يدير الجهاز ويوفر بيئة عمل البرامج، أما التطبيق (مثل Word) فيؤدي مهمة محددة ويعمل فوق نظام التشغيل."}, {"q": "ماذا يعني اختصار URL؟", "o": ["Uniform Resource Locator — عنوان مورد على الإنترنت", "Universal Remote Link — رابط تحكم عن بعد", "User Registration Login — تسجيل دخول", "Unified Routing Language — لغة توجيه"], "a": 0, "e": "URL هو العنوان الكامل لصفحة أو ملف على الإنترنت، مثل https://example.com/page."}, {"q": "أي بروتوكول يُستخدم لتصفح صفحات الويب بشكل مشفر وآمن؟", "o": ["HTTP", "FTP", "HTTPS", "SMTP"], "a": 2, "e": "HTTPS هو النسخة المشفرة من HTTP، وتظهر كقفل بجانب العنوان. SMTP للبريد الإلكتروني وFTP لنقل الملفات."}, {"q": "ما وظيفة كلمة المرور القوية؟ وما أفضل صيغة لها؟", "o": ["اسمك وتاريخ ميلادك لسهولة التذكر", "123456 لأنها شائعة", "مزيج طويل من حروف وأرقام ورموز مختلف لكل حساب", "كلمة واحدة من القاموس"], "a": 2, "e": "كلمة المرور القوية طويلة (12+ حرف) وتجمع حروف كبيرة وصغيرة وأرقام ورموز، وتكون مختلفة لكل حساب. المعلومات الشخصية والكلمات الشائعة يسهل تخمينها."}, {"q": "ما هو التصيد الاحتيالي (Phishing)؟", "o": ["برنامج مضاد للفيروسات", "رسائل مزيفة تنتحل جهة موثوقة لسرقة بياناتك", "طريقة لتسريع الإنترنت", "نوع من أنواع الطابعات"], "a": 1, "e": "التصيد رسائل أو مواقع مزيفة تدّعي أنها بنك أو جهة رسمية لتسرق كلمات المرور والبيانات. القاعدة: لا تضغط روابط الرسائل المجهولة وتحقق من العنوان بنفسك."}, {"q": "في برنامج Excel، ماذا تفعل الدالة SUM؟", "o": ["تطرح الخلايا", "تجمع قيم نطاق من الخلايا", "تحسب المتوسط فقط", "ترتب الخلايا أبجديًا"], "a": 1, "e": "SUM تجمع قيم الخلايا، مثل =SUM(A1:A10) لجمع الخلايا من A1 إلى A10. المتوسط دالتها AVERAGE."}, {"q": "في Excel، ماذا يعني المرجع $A$1 في المعادلة؟", "o": ["خطأ في الكتابة", "مرجع مطلوب (ثابت) لا يتغير عند نسخ المعادلة", "مرجع لورقة أخرى", "عملة الدولار"], "a": 1, "e": "علامة $ تجعل المرجع مطلقًا: عند نسخ المعادلة لخلايا أخرى يظل يشير لـ A1 نفسها، وهو مفيد للثوابت مثل نسبة الضريبة."}, {"q": "ما وظيفة الاختصار Ctrl+S في معظم البرامج؟", "o": ["إغلاق البرنامج", "حفظ الملف", "طباعة المستند", "نسخ نص"], "a": 1, "e": "Ctrl+S يحفظ الملف الحالي. Ctrl+C للنسخ وCtrl+P للطباعة."}, {"q": "ما الفرق بين البيانات والمعلومات؟", "o": ["لا فرق بينهما", "البيانات حقائق خام، والمعلومات بيانات معالجة ذات معنى", "المعلومات أرقام فقط", "البيانات موجودة في الكتب فقط"], "a": 1, "e": "البيانات خام غير مرتب (أرقام مبيعات يومية)، والمعلومات ناتج معالجتها وترتيبها لتفيد قرارًا (تقرير أفضل شهر مبيعات)."}, {"q": "ما المقصود بقاعدة البيانات؟", "o": ["مجلد صور على الجهاز", "مجموعة منظمة من البيانات المترابطة يمكن البحث فيها وتحديثها", "نوع من الشاشات", "موقع إلكتروني"], "a": 1, "e": "قاعدة البيانات نظام منظم لتخزين بيانات مترابطة (كجدول العملاء وطلباتهم) مع إمكانية البحث والتحديث والتقارير بكفاءة."}, {"q": "ما وظيفة لغة SQL؟", "o": ["تصميم الصور", "الاستعلام عن البيانات وإدارتها في قواعد البيانات", "تشغيل الألعاب", "ضغط الملفات"], "a": 1, "e": "SQL لغة قياسية للتعامل مع قواعد البيانات: SELECT للاستعلام، INSERT للإضافة، UPDATE للتعديل، DELETE للحذف."}, {"q": "في البرمجة، ما المقصود بالمتغير (Variable)؟", "o": ["خطأ في الكود", "مساحة في الذاكرة لها اسم وتخزن قيمة قابلة للتغيير", "نوع طابعة", "ملف صوتي"], "a": 1, "e": "المتغي  منصوب يبين هيئة صاحبه وقت وقوع الفعل: جاء وهو في حال الضحك."}, {"q": "في «قلمُ الطالبِ»، كلمة «الطالبِ» تعرب:", "o": ["مبتدأ", "مضافًا إليه مجرورًا", "فاعلًا", "نعتًا"], "a": 1, "e": "المضاف إليه اسم مجرور يأتي بعد المضاف ويكمل معناه، وعلامة جره الكسرة."}, {"q": "في «سافر أخوك محمدٌ»، كلمة «محمدٌ» تعرب:", "o": ["فاعلًا", "بدلًا مرفوعًا", "مفعولًا به", "حالًا"], "a": 1, "e": "البدل تابع يحل محل المتبوع ويُقصَد به الحكم: محمدٌ بدل من «أخوك» ومرفوع مثله."}, {"q": "ما علامة رفع الفعل المضارع الصحيح الآخر؟", "o": ["الفتحة", "الضمة الظاهرة", "السكون", "حذف النون"], "a": 1, "e": "الفعل المضارع المعرب الصحيح الآخر يرفع بالضمة، وينصب بالفتحة، ويجزم بالسكون."}, {"q": "في «لن أتأخرَ عن موعدي»، الفعل «أتأخرَ» مضارع:", "o": ["مرفوع بالضمة", "منصوب بلن وعلامته الفتحة", "مجزوم بالسكون", "مبني"], "a": 1, "e": "«لن» حرف نفي ونصب واستقبال، ينصب المضارع بالفتحة: لن أتأخرَ، لن أنسىَ."}, {"q": "في «لم أتأخرْ»، الفعل «أتأخرْ» مضارع:", "o": ["مرفوع", "منصوب", "مجزوم بلم وعلامته السكون", "ماضٍ"], "a": 2, "e": "«لم» حرف نفي وجزم وقلب، يجزم المضارع بالسكون ويقلب زمنه إلى الماضي."}, {"q": "الفعل الماضي في العربية يكون:", "o": ["معربًا دائمًا", "مبنيًا غالبًا على الفتح", "منصوبًا دائمًا", "مجزومًا دائمًا"], "a": 1, "e": "الفعل الماضي مبني، وغالب بنائه الفتح (كتبَ، ذهبَ)، ويبنى على السكون مع ضمائر الرفع المتحركة (كتبتُ)."}, {"q": "في «يا طالبَ العلمِ اجتهدْ»، أداة النداء هي:", "o": ["طالبَ", "العلمِ", "يا", "اجتهدْ"], "a": 2, "e": "«يا» أشهر أدوات النداء، ينادى بها القريب والبعيد، والمنادى هنا «طالبَ» منصوب لأنه مضاف."}, {"q": "«ما أجملَ الصباحَ!» هذه الجملة أسلوب:", "o": ["استفهام", "تعجب", "نفي", "أمر"], "a": 1, "e": "التعجب القياسي يأتي بصيغتي «ما أفعلَه» و«أفعِلْ به»: ما أجملَ الصباحَ، أجمِلْ بالفجر."}, {"q": "ما مرادف كلمة «شجاع»؟", "o": ["جبان", "مقدام", "كسول", "غافل"], "a": 1, "e": "المرادف هو اللفظ المساوي في المعنى: شجاع = مقدام = جسور، وعكسها جبان."}, {"q": "ما ضد كلمة «الكرم»؟", "o": ["الجود", "السخاء", "البخل", "العطاء"], "a": 2, "e": "الضد هو اللفظ المعاكس في المعنى: الكرم ضده ال , "هذي الفتاة مجتهدة"], "a": 0, "e": "«هذه» اسم إشارة للمفردة المؤنثة وتكتب بتاء مربوطة ثم هاء: هذه، وتكتب «هذا» للمذكر بلا هاء زائدة."}, {"q": "أي كتابة صحيحة عند التعليل؟", "o": ["إذن سأدرس جيدًا", "إذًا سأدرس جيدًا", "أذن سأدرس جيدًا", "أذا سأدرس جيدًا"], "a": 0, "e": "«إذن» حرف جواب وتعليل تكتب نونها ساكنة، أما «إذًا» فظرف تفصيل يأتي بعد «ما» غالبًا: ما دمت مجتهدًا إذًا فستنجح."}, {"q": "الفعل «دعا» يسمى فعلًا:", "o": ["أجوف", "معتل الآخر (ناقصًا)", "مثالًا", "مهموزًا"], "a": 1, "e": "الفعل الناقص ما كان آخره حرف علة: دعا (ألف مقصورة)، رمى، مشى. والأجوف وسطه علة (قال)، والمثال أوله علة (وعد)."}, {"q": "الفعل «قال» يسمى فعلًا:", "o": ["أجوف", "ناقصًا", "مثالًا", "صحيح الآخر"], "a": 0, "e": "الأجوف ما كانت عينه حرف علة: قال، باع، سار. وفي المضارع تظهر العلة: يقول، يبيع."}, {"q": "الفعل «وعد» يسمى فعلًا:", "o": ["أجوف", "ناقصًا", "مثالًا واويًا", "مهموز الفاء"], "a": 2, "e": "المثال ما كانت فاؤه حرف علة: وعد، وصل، يئس. والواو في المضارع المجزوم تحذف غالبًا: لم يعِدْ."}, {"q": "ما جمع كلمة «قمر»؟", "o": ["قمور", "أقمار", "قمرات", "قمرون"], "a": 1, "e": "قمر يجمع على «أقمار» جمع تكسير، مثل: شهر/أشهر، بحر/بحار، نهر/أنهار."}, {"q": "ما مفرد كلمة «مدارس»؟", "o": ["مدرس", "مدرسة", "دارس", "مدارسية"], "a": 1, "e": "«مدارس» جمع تكسير مفرده «مدرسة» (اسم مكان من درس على وزن مفعَلة)، أي المكان الذي تتم فيه الدراسة."}, {"q": "في «محمدٌ مجتهدٌ»، كلمة «محمدٌ» تعرب:", "o": ["خبرًا", "مبتدأ مرفوعًا", "فاعلًا", "مفعولًا به"], "a": 1, "e": "المبتدأ اسم مرفوع يبدأ به الاسمية، وخبره «مجتهدٌ» مرفوع أيضًا ليكتمل معنى الجملة."}, {"q": "في «المعلمُ مخلصٌ»، كلمة «مخلصٌ» تعرب:", "o": ["مبتدأ", "خبرًا مرفوعًا", "فاعلًا", "حالًا"], "a": 1, "e": "الخبر يتمم معنى الجملة الاسمية مع المبتدأ، وهو هنا «مخلصٌ» مرفوع وعلامة رفعه الضمة."}, {"q": "ما ضد كلمة «الفرح»؟", "o": ["السرور", "البهجة", "الحزن", "الغبطة"], "a": 2, "e": "الفرح ضده الحزن، أما السرور والبهجة والغبطة فمرادفات له تختلف في الدرجة والاستعمال."}, {"q": "في «كتبتُ الرسالةَ»، التاء في «كتبتُ» هي:", "o": ["تاء مربوطة", "تاء الفاعل مفتوحة", "تاء التأنيث الساكنة", "هاء"], "a": 1, "e": "تاء الفاعل ضمير متصل مبني يدل على المتكلم وتكتب مفتوحة: كتبتُ، قرأتُ. أما تاء التأنيث الساكنة فللمخاطبة أو الغائبة: كتبتِ، كتبتْ."}, {"q": "حرف الجر في «كتبتُ بالقلمِ» هو:", "o": ["كتبتُ", "القلمِ", "الباء", "لا حرف جر"], "a": 2, "e": "الباء حرف جر يفيد الاستعانة أو المصاحبة: كتبت بالقلم، جلست بالحديقة. وما بعده يجر بالكسرة."}, {"q": "ما نوع ألف «الشمس» في «ال تعريف»؟", "o": ["همزة قطع", "همزة وصل", "ألف تفضيل", "ألف مقصورة"], "a": 1, "e": "ألف «ال» التعريف همزة وصل تسقط نطقًا عند الوصل: «رأيت الشمس» تُنطق «رأيتشمس» دون نطق الألف."}, {"q": "في «محمدٌ أذكى من أخيه»، كلمة «أذكى» تسمى:", "o": ["اسم فاعل", "اسم تفضيل", "صفة مشبهة", "اسم مفعول"], "a": 1, "e": "اسم التفضيل يصاغ على وزن «أفعل» للمفاضلة بين شيئين في صفة: أذكى من، أجمل من، أكبر من."}, {"q": "ما إعراب «في المدرسةِ» في جملة «ذاكرَ الطالبُ في المدرسةِ»؟", "o": ["مبتدأ وخبر", "جار ومجرور متعلق بالفعل", "فاعل", "مفعول فيه"], "a": 1, "e": "«في» حرف جر و«المدرسةِ» اسم مجرور بالكسرة، والجار والمجرور متعلق بالفعل «ذاكرَ» ويبين مكان المذاكرة."}, {"q": "أي جملة صحيحة الإملاء؟", "o": ["ذهب الولد الي المدرسة", "ذهب الولد إلى المدرسة", "ذهب الولد إلي المدرسة", "ذهب الولد علي المدرسة"], "a": 1, "e": "«إلى» حرف جر همزته همزة قطع تكتب على السطر ثم لام ثم ألف مقصورة، وتعني انتهاء الغاية المكانية أو الزمانية."}], "english": [{"q": "اختر التصريف الصحيح: «She ___ to school every day.»", "o": ["go", "goes", "going", "went"], "a": 1, "e": "مع المضارع البسيط والفاعل المفرد الغائب (she/he/it) نضيف s للفعل: She goes. أما go فللجمع و I/You/We/They."}, {"q": "اختر الإجابة الصحيحة: «I ___ TV yesterday evening.»", "o": ["watch", "watches", "watched", "watching"], "a": 2, "e": "«yesterday» تدل على الماضي البسيط، والفعل المنتظم يأخذ ed: watched. المضارع watch لا يناسب زمن الجملة."}, {"q": "اختر أداة التعريف الصحيحة: «I ate ___ apple.»", "o": ["a", "an", "the", "لا تحتاج"], "a": 1, "e": "نستخدم an قبل الأسماء المفردة التي تبدأ بصوت متحرك (a, e, i, o, u): an apple, an egg. و a قبل الصوت الساكن: a book."}, {"q": "اختر الإجابة الصحيحة: «This is ___ hour of work.»", "o": ["a", "an", "the", "لا تحتاج"], "a": 1, "e": "حرف h في hour لا ينطق، فتبدأ الكلمة بصوت متحرك /aʊ/، لذلك نستخدم an: an hour, an honest man."}, {"q": "اختر المقارنة الصحيحة: «My brother is ___ than me.»", "o": ["tall", "taller", "tallest", "more tall"], "a": 1, "e": "الصفة القصيرة تأخذ er في المقارنة مع than: taller than. أما tallest فللتفضيل مع the."}, {"q": "اختر التفضيل الصحيح: «This is ___ building in the city.»", "o": ["taller", "the tallest", "more tall", "tall"], "a": 1, "e": "التفضيل (superlative) للصفات القصيرة: the + صفة + est، مثل the tallest. يستخدم عند المفاضلة بين ثلاثة أو أكثر."}, {"q": "اختر حرف الجر الصحيح: «I live ___ Cairo.»", "o": ["in", "on", "at", "from"], "a": 0, "e": "نستخدم in مع المدن والدول: in Cairo, in Egypt. و at مع الأماكن المحددة الدقيقة: at the station، و on مع الشوارع: on Talaat Harb Street."}, {"q": "اختر حرف الجر الصحيح: «The meeting is ___ 9 o'clock.»", "o": ["in", "on", "at", "by"], "a": 2, "e": "نستخدم at مع الساعات: at 9 o'clock, at noon. و in مع الشهور والسنوات: in July, in 2026، و on مع الأيام والتواريخ."}, {"q": "اختر حرف الجر الصحيح: «The exam is ___ Monday.»", "o": ["in", "on", "at", "for"], "a": 1, "e": "نستخدم on مع أيام الأسبوع والتواريخ: on Monday, on May 5th. أما in فللشهور والسنوات والفصول."}, {"q": "اختر الإجابة الصحيحة: «I have lived here ___ 2020.»", "o": ["for", "since", "from", "ago"], "a": 1, "e": "since تأتي مع نقطة بداية محددة في الزمن: since 2020, since Monday. أما for فمع مدة زمنية: for five years."}, {"q": "اختر الإجابة الصحيحة: «I have studied English ___ five years.»", "o": ["since", "for", "from", "at"], "a": 1, "e": "for تأتي مع مدة زمنية: for five years, for two months. أما since فمع نقطة البداية: since 2021."}, {"q": "اختر الإجابة الصحيحة: «There isn't ___ milk in the fridge.»", "o": ["many", "much", "a few", "few"], "a": 1, "e": "much تستخدم مع الأسماء غير المعدودة (milk, water, time) في النفي والسؤال، بينما many مع المعدود: many books."}, {"q": "اختر الإجابة الصحيحة: «How ___ students are in your class?»", "o": ["much", "many", "little", "any"], "a": 1, "e": "How many تستخدم مع الأسماء المعدودة: How many students/books. و How much مع غير المعدود: How much money."}, {"q": "اختر الإجابة الصحيحة: «I have ___ friends in Alexandria.»", "o": ["a little", "a few", "much", "little"], "a": 1, "e": "a few مع المعدود بمعنى «عدد قليل لكن موجود»، و a little مع غير المعدود. friends اسم معدود لذا a few."}, {"q": "اختر الإجابة الصحيحة: «I ___ just finished my homework.»", "o": ["has", "have", "am", "was"], "a": 1, "e": "المضارع التام (present perfect) = have/has + التصريف الثالث. مع I نستخدم have: I have finished. just تدل على حدوثه للتو."}, {"q": "اختر صيغة المبني للمجهول: «The letter ___ by Ahmed yesterday.»", "o": ["wrote", "was written", "is writing", "writes"], "a": 1, "e": "المبني للمجهول في الماضي = was/were + التصريف الثالث: The letter was written. الفاعل المذكور بعد by ليس موضع الاهتمام."}, {"q": "اختر السؤال المذيل الصحيح: «It's very hot today, ___ it?»", "o": ["is", "isn't", "doesn't", "don't"], "a": 1, "e": "السؤال المذيل (tag question) يعكس الجملة: جملة مثبتة بـ is يصاحبها isn't it، وجملة منفية يصاحبها سؤال مثبت."}, {"q": "اختر الفعل الناقص الصحيح: «You ___ stop when the light is red.»", "o": ["must", "must to", "musts", "musted"], "a": 0, "e": "الأفعال الناقصة (must, can, should) لا تتغير مع الفاعل ولا يأتي بعدها to: You must stop. must تعني الوجوب."}, {"q": "ما جمع كلمة «child»؟", "o": ["childs", "childes", "children", "childrens"], "a": 2, "e": "child جمعها الشاذ children. من الجموع الشاذة أيضًا: man/men, woman/women, foot/feet, tooth/teeth, mouse/mice."}, {"q": "ما جمع كلمة «tooth»؟", "o": ["tooths", "teeth", "toothes", "tooth"], "a": 1, "e": "tooth جمعها الشاذ teeth. هذه الجموع لا تتبع قاعدة إضافة s وتحفظ كما هي."}, {"q": "اختر الضمير الصحيح: «This book is ___, not yours.»", "o": ["her", "hers", "she", "herself"], "a": 1, "e": "hers ضمير ملكية يقوم مقام الاسم (her book)، أما her فصفة ملكية تحتاج اسمًا بعدها. The book is hers = الكتاب كتابها."}, {"q": "اختر الإجابة الصحيحة: «I enjoy ___ stories.»", "o": ["read", "to read", "reading", "reads"], "a": 2, "e": "بعد enjoy وغيرها (like, finish, avoid) يأتي الفعل بصيغة المصدر بـ ing: enjoy reading, finish working."}, {"q": "اختر الإجابة الصحيحة: «I want ___ a doctor.»", "o": ["become", "to become", "becoming", "became"], "a": 1, "e": "بعد want وغيرها (decide, hope, plan) يأتي المصدر بـ to: I want to become, I decided to study."}, {"q": "اختر الإجابة الصحيحة: «___ my brother ___ my sister passed the exam. Both did well.»", "o": ["Either / or", "Neither / nor", "Both / and", "Not only / but"], "a": 2, "e": "Both A and B تعني «كلاهما» وتأتي مع فعل جمع: Both my brother and my sister passed. Either/or تعني أحدهما، و Neither/nor لا هذا ولا ذاك."}, {"q": "اختر الإجابة الصحيحة: «I don't have ___ money.»", "o": ["some", "any", "many", "a"], "a": 1, "e": "any تستخدم في النفي والسؤال: I don't have any money. Do you have any? أما some ففي الإثبات والعروض: I have some money."}, {"q": "اختر أداة الإشارة الصحيحة: «___ are my books over there.»", "o": ["This", "That", "These", "Those"], "a": 3, "e": "Those للجمع البعيد، و These للجمع القريب، و That للمفرد البعيد، و This للمفرد القريب. الكتب بعيدة (over there) فنختار Those."}, {"q": "اختر الإجابة الصحيحة: «___ phone is this? — It's mine.»", "o": ["Who's", "Whose", "Who", "Whom"], "a": 1, "e": "Whose تسأل عن الملكية: Whose phone? (هاتف مَن هذا؟). أما Who's فاختصار Who is (من هو؟)."}, {"q": "اختر الإجابة الصحيحة: «The students forgot ___ books at home.»", "o": ["there", "their", "they're", "theirs"], "a": 1, "e": "their صفة ملكية للجمع: their books. أما there فظرف مكان (هناك)، و they're اختصار they are."}, {"q": "اختر الإجابة الصحيحة: «I need some ___ about the course.»", "o": ["information", "informations", "an information", "information's"], "a": 0, "e": "information اسم غير معدود في الإنجليزية، لا يجمع ولا يسبقه a/an. نقول: some information, a piece of information."}, {"q": "اختر الزمن الصحيح: «Look! She ___ dinner now.»", "o": ["cooks", "is cooking", "cooked", "has cooked"], "a": 1, "e": "now و Look! و Listen! مفاتيح المضارع المستمر: am/is/are + الفعل بـ ing. She is cooking now."}, {"q": "اختر الإجابة الصحيحة: «If it rains tomorrow, we ___ at home.»", "o": ["will stay", "would stay", "stay", "stayed"], "a": 0, "e": "الشرطية الأولى (احتمال حقيقي): If + مضارع بسيط، والجواب will + مصدر: If it rains, we will stay at home."}, {"q": "اختر الإجابة الصحيحة: «If I ___ rich, I would travel the world.»", "o": ["am", "was", "were", "be"], "a": 2, "e": "الشرطية الثانية (خيال/استحالة): If + ماضٍ بسيط، ومع to be نستخدم were مع كل الضمائر: If I were rich, I would travel."}, {"q": "في الكلام المنقول: He said he ___ tired.", "o": ["is", "was", "were", "be"], "a": 1, "e": "عند النقل إلى الكلام غير المباشر يتحول المضارع إلى ماضٍ: He said «I am tired» ← He said he was tired."}, {"q": "اختر الحال الصحيحة: «She speaks English very ___.»", "o": ["good", "well", "best", "better"], "a": 1, "e": "well حال (adverb) يصف الفعل speaks، أما good فصفة تصف الأسماء: She is a good speaker, she speaks well."}, {"q": "اختر الإجابة الصحيحة: «I am interested ___ learning Python.»", "o": ["in", "on", "at", "for"], "a": 0, "e": "interested in تعني «مهتم بـ». احفظ الصفات مع حروف جرها: good at, afraid of, married to, angry with, famous for."}, {"q": "اختر الإجابة الصحيحة: «My sister is good ___ mathematics.»", "o": ["in", "at", "on", "for"], "a": 1, "e": "good at تعني «جيد في»: good at math, good at drawing. عكسها bad at."}, {"q": "ما معنى كلمة «borrow»؟", "o": ["يستعير (يأخذ)", "يعير (يعطي)", "يشتري", "يبيع"], "a": 0, "e": "borrow تعني أن تستعير شيئًا من شخص: I borrowed a book from Ali. أما lend فتعني أن تعير شيئًا لشخص: Ali lent me a book."}, {"q": "ما ضد كلمة «cheap»؟", "o": ["free", "expensive", "low", "poor"], "a": 1, "e": "cheap (رخيص) ضدها expensive (غالٍ). انتبه: poor تعني فقيرًا ولا تصلح ضدًا للسعر."}, {"q": "ما مرادف كلمة «begin»؟", "o": ["end", "start", "finish", "stop"], "a": 1, "e": "begin مرادفها start (يبدأ). أما end و finish و stop فتعني الإنهاء وهي أضداد لها."}, {"q": "ما معنى كلمة «library»؟", "o": ["مكتبة", "مكتب بريد", "مخبز", "مستشفى"], "a": 0, "e": "library مكتبة (مكان الكتب). انتبه: مكتبة بمعنى محل بيع الكتب هي bookstore أو bookshop."}, {"q": "اختر الفعل المساعد الصحيح: «She ___ not like coffee.»", "o": ["do", "does", "is", "has"], "a": 1, "e": "في نفي المضارع البسيط مع she/he/it نستخدم doesn't (does not): She doesn't like coffee. ومع I/You/We/They: don't."}, {"q": "اختر فعل الكينونة الصحيح: «They ___ my friends.»", "o": ["is", "am", "are", "be"], "a": 2, "e": "are تأتي مع الجمع ومع you: They are, You are. و is مع المفرد الغائب، و am مع I فقط."}, {"q": "اختر الإجابة الصحيحة: «___ you at home last night?»", "o": ["Was", "Were", "Did", "Are"], "a": 1, "e": "مع you في الماضي نستخدم were: Were you at home? أما Was فمع I/he/she/it، و Did تسبق المصدر."}, {"q": "اختر الإجابة الصحيحة: «Where ___ you go yesterday?»", "o": ["do", "does", "did", "are"], "a": 2, "e": "في أسئلة الماضي البسيط نستخدم did + المصدر: Where did you go? الفعل بعد did يرجع لصورته الأصلية."}, {"q": "اختر الإجابة الصحيحة: «One of my ___ is a teacher.»", "o": ["friend", "friends", "friend's", "friending"], "a": 1, "e": "بعد one of يأتي اسم جمع: one of my friends, one of the students. المعنى: واحد من بين الكثيرين."}, {"q": "اختر الإجابة الصحيحة: «The coffee is ___ hot to drink.»", "o": ["very", "too", "enough", "so much"], "a": 1, "e": "too + صفة تعني «أكثر من اللازم» بنتيجة سلبية: too hot to drink (ساخن جدًا بحيث لا يمكن شربه). very مجرد تأكيد."}, {"q": "اختر الإجابة الصحيحة: «He is tall ___ to reach the shelf.»", "o": ["too", "enough", "very", "so"], "a": 1, "e": "enough تأتي بعد الصفة: tall enough to reach (طويل بما يكفي للوصول). too تعني أكثر من اللازم ولا تناسب المعنى."}, {"q": "اختر الإجابة الصحيحة: «Please ___ your homework before dinner.»", "o": ["make", "do", "take", "have"], "a": 1, "e": "do homework من التراكيب الثابتة (collocations): do homework, do business, do the dishes. أما make فمع: make a mistake, make breakfast."}, {"q": "اختر الإجابة الصحيحة: «Don't ___ noise! The baby is sleeping.»", "o": ["do", "make", "take", "say"], "a": 1, "e": "make noise تركيب ثابت بمعنى «يحدث ضوضاء». التراكيب الثابتة تحفظ كوحدة واحدة ولا تترجم حرفيًا."}, {"q": "اختر الإجابة الصحيحة: «I ___ my keys yesterday and found them today.»", "o": ["lose", "losed", "lost", "losing"], "a": 2, "e": "lose فعل شاذ تصريفه الماضي lost: lose/lost/lost. مثل: find/found, buy/bought, teach/taught."}, {"q": "اختر الإجابة الصحيحة: «Have you ever ___ to Luxor?»", "o": ["be", "was", "been", "went"], "a": 2, "e": "في المضارع التام نستخدم التصريف الثالث: have been to تعني «ذهبت وعدت». Have you ever been to Luxor? سؤال عن تجربة سابقة."}, {"q": "اختر الإجابة الصحيحة: «This car is ___ than that one.»", "o": ["expensiver", "more expensive", "most expensive", "expensivest"], "a": 1, "e": "الصفات الطويلة (ثلاثة مقاطع فأكثر) تأخذ more في المقارنة و the most في التفضيل: more expensive, the most expensive."}, {"q": "اختر الإجابة الصحيحة: «She has lived here ___ she was a child.»", "o": ["for", "since", "ago", "from"], "a": 1, "e": "since تأتي مع جملة كاملة أيضًا: since she was a child (منذ أن كانت طفلة). for تسبق مدة زمنية فقط."}, {"q": "اختر الإجابة الصحيحة: «We ___ the pyramids two years ago.»", "o": ["visit", "have visited", "visited", "visiting"], "a": 2, "e": "ago تدل على وقت محدد في الماضي فنستخدم الماضي البسيط: visited. لا يجمع ago مع المضارع التام."}, {"q": "اختر الإجابة الصحيحة: «If you study hard, you ___ the exam.»", "o": ["pass", "will pass", "would pass", "passed"], "a": 1, "e": "الشرطية الأولى: If + مضارع بسيط ثم will + مصدر. النتيجة المحتملة للمذاكرة الجادة هي النجاح: will pass."}], "general": [{"q": "ما أكبر قارات العالم مساحة؟", "o": ["أفريقيا", "آسيا", "أوروبا", "أمريكا الشمالية"], "a": 1, "e": "آسيا أكبر القارات مساحة وسكانًا، تليها أفريقيا ثم أمريكا الشمالية."}, {"q": "ما أكبر محيطات العالم؟", "o": ["الأطلسي", "الهندي", "الهادئ", "المتجمد الشمالي"], "a": 2, "e": "المحيط الهادئ أكبر محيطات العالم، تليه الأطلسي ثم الهندي."}, {"q": "ما أطول أنهار العالم؟", "o": ["الأمازون", "النيل", "الفرات", "الدانوب"], "a": 1, "e": "نهر النيل (نحو 6650 كم) يُدرَّس في المراجع العربية بوصفه أطول أنهار العالم، ويمر بمصر والسودان ومنابعه في شرق أفريقيا."}, {"q": "ما عاصمة المملكة العربية السعودية؟", "o": ["جدة", "مكة", "الرياض", "الدمام"], "a": 2, "e": "الرياض عاصمة السعودية وأكبر مدنها، بينما جدة أكبر موانئها على البحر الأحمر."}, {"q": "ما عاصمة فرنسا؟", "o": ["ليون", "مارسيليا", "باريس", "نيس"], "a": 2, "e": "باريس عاصمة فرنسا وأكبر مدنها، وتشتهر ببرج إيفل ومتحف اللوفر."}, {"q": "ما عاصمة اليابان؟", "o": ["أوساكا", "كيوتو", "طوكيو", "هيروشيما"], "a": 2, "e": "طوكيو عاصمة اليابان ومن أكبر مدن العالم، وكيوتو كانت العاصمة التاريخية القديمة."}, {"q": "ما عاصمة ألمانيا؟", "o": ["ميونخ", "هامبورغ", "برلين", "فرانكفورت"], "a": 2, "e": "برلين عاصمة ألمانيا، بينما فرانكفورت المركز المالي وميونخ عاصمة بافاريا."}, {"q": "ما عاصمة تركيا؟", "o": ["إسطنبول", "أنقرة", "إزمير", "بورصة"], "a": 1, "e": "أنقرة عاصمة تركيا الرسمية منذ 1923، رغم أن إسطنبول أكبر مدنها وأشهرها."}, {"q": "ما عاصمة كندا؟", "o": ["تورونتو", "فانكوفر", "أوتاوا", "مونتريال"], "a": 2, "e": "أوتاوا عاصمة كندا، بينما تورونتو أكبر مدنها. خطأ شائع لأن تورونتو أشهر إعلاميًا."}, {"q": "ما عاصمة أستراليا؟", "o": ["سيدني", "ملبورن", "كانبيرا", "بيرث"], "a": 2, "e": "كانبيرا عاصمة أستراليا، اختيرت حلًا وسطًا بين سيدني وملبورن المتنافستين."}, {"q": "كم عدد قارات العالم؟", "o": ["5", "6", "7", "8"], "a": 2, "e": "القارات السبع: آسيا، أفريقيا، أمريكا الشمالية، أمريكا الجنوبية، أوروبا، أستراليا (أوقيانيا)، القارة القطبية الجنوبية."}, {"q": "ما الكوكب الملقب بالكوكب الأحمر؟", "o": ["الزهرة", "المريخ", "المشتري", "عطارد"], "a": 1, "e": "المريخ يبدو أحمر اللون بسبب أكسيد الحديد (الصدأ) في تربته، وهو رابع كواكب المجموعة الشمسية."}, {"q": "ما أكبر كواكب المجموعة الشمسية؟", "o": ["الأرض", "زحل", "المشتري", "نبتون"], "a": 2, "e": "المشتري أكبر الكواكب، كتلته أكبر من كل الكواكب الأخرى مجتمعة، ويليه زحل صاحب الحلقات الشهيرة."}, {"q": "ما أقرب كوكب إلى الشمس؟", "o": ["الزهرة", "الأرض", "عطارد", "المريخ"], "a": 2, "e": "عطارد أقرب الكواكب إلى الشمس وأسرعها دورانًا حولها (88 يومًا)، يليه الزهرة ثم الأرض."}, {"q": "عند أي درجة مئوية يغلي الماء عند مستوى سطح البحر؟", "o": ["90", "95", "100", "110"], "a": 2, "e": "يغلي الماء عند 100 درجة مئوية عند الضغط الجوي العادي، وتقل الدرجة في المرتفعات حيث ينخفض الضغط."}, {"q": "ما الغاز الأساسي الذي نتنفسه لبقاء خلايانا حية؟", "o": ["ثاني أكسيد الكربون", "الأكسجين", "النيتروجين", "الهيدروجين"], "a": 1, "e": "الأكسجين ضروري لإنتاج الطاقة في الخلايا. ملاحظة: النيتروجين هو الأكثر في الهواء (نحو 78%) لكننا لا نستخدمه في التنفس الخلوي."}, {"q": "ما الغاز الذي تمتصه النباتات لعملية البناء الضوئي؟", "o": ["الأكسجين", "النيتروجين", "ثاني أكسيد الكربون", "الأوزون"], "a": 2, "e": "النبات يمتص ثاني أكسيد الكربون ويطلق الأكسجين في البناء الضوئي بوجود ضوء الشمس والماء واليخضور."}, {"q": "كم عدد أيام السنة الكبيسة؟", "o": ["364", "365", "366", "360"], "a": 2, "e": "السنة الكبيسة 366 يومًا (فبراير 29 يومًا)، وتأتي كل 4 سنوات تقريبًا لتصحيح فرق دوران الأرض حول الشمس."}, {"q": "ما عملة اليابان؟", "o": ["اليوان", "الين", "الوون", "الدولار"], "a": 1, "e": "الين عملة اليابان. اليوان عملة الصين، والوون عملة كوريا الجنوبية، وهي أسماء متقاربة كثيرًا ما تختلط."}, {"q": "ما عملة المملكة العربية السعودية؟", "o": ["الدينار", "الريال", "الدرهم", "الجنيه"], "a": 1, "e": "الريال السعودي عملة السعودية. الدرهم عملة الإمارات، والدينار عملة الكويت والأردن ودول أخرى."}, {"q": "ما عملة بريطانيا؟", "o": ["اليورو", "الدولار", "الجنيه الإسترليني", "الفرنك"], "a": 2, "e": "الجنيه الإسترليني عملة المملكة المتحدة، ولم تعتمد بريطانيا اليورو حتى قبل خروجها من الاتحاد الأوروبي."}, {"q": "من المخترع المشهور للمصباح الكهربائي العملي؟", "o": ["نيوتن", "إديسون", "بيل", "تسلا"], "a": 1, "e": "توماس إديسون طوّر المصباح المتوهج العملي القابل للتسويق عام 1879، بعد جهود مخترعين سابقين في تحسين الفكرة."}, {"q": "من يُنسب إليه اختراع الهاتف؟", "o": ["ألكسندر جراهام بيل", "ماركوني", "إديسون", "مورس"], "a": 0, "e": "ألكسندر جراهام بيل سجل براءة اختراع الهاتف عام 1876. ماركوني اشتهر باللاسلكي، ومورس بالتلغراف."}, {"q": "من كان أول رئيس للولايات المتحدة الأمريكية؟", "o": ["أبراهام لينكولن", "توماس جيفرسون", "جورج واشنطن", "جون آدامز"], "a": 2, "e": "جورج واشنطن أول رئيس أمريكي (1789-1797)، قاد الجيش في حرب الاستقلال عن بريطانيا."}, {"q": "من نقل كتاب «كليلة ودمنة» إلى العربية؟", "o": ["الجاحظ", "عبد الله بن المقفع", "ابن خلدون", "المتنبي"], "a": 1, "e": "عبد الله بن المقفع نقل كليلة ودمنة من الفارسية في العصر العباسي، وهو كتاب حكم وأمثال على ألسنة الحيوان."}, {"q": "من صاحب كتاب «القانون في الطب»؟", "o": ["ابن البيطار", "ابن سينا", "الرازي", "ابن النفيس"], "a": 1, "e": "ابن سينا (أفيسينا) ألف القانون في الطب، وبقي مرجعًا في تدريس الطب بأوروبا قرونًا. الرازي ألف «الحاوي»."}, {"q": "من العالم المرتبط بقانون الجاذبية الأرضية؟", "o": ["أينشتاين", "نيوتن", "جاليليو", "داروين"], "a": 1, "e": "إسحاق نيوتن صاغ قانون الجاذبية العام وقوانين الحركة في القرن السابع عشر، وقصة التفاحة من أشهر حكايات العلم."}, {"q": "ما أطول برج في العالم حاليًا؟", "o": ["برج إيفل", "برج خليفة", "برج شنغهاي", "برج العرب"], "a": 1, "e": "برج خليفة في دبي أطول بناء شيده الإنسان (828 مترًا) منذ افتتاحه عام 2010."}, {"q": "في أي محافظة تقع أهرامات الجيزة؟", "o": ["القاهرة", "الجيزة", "الأقصر", "أسوان"], "a": 1, "e": "الأهرامات الثلاثة وأبو الهول على هضبة الجيزة بمحافظة الجيزة، وهي آخر عجائب الدنيا السبع القديمة الباقية."}, {"q": "كم عدد ألوان قوس قزح؟", "o": ["5", "6", "7", "8"], "a": 2, "e": "ألوان قوس قزح السبعة: أحمر، برتقالي، أصفر، أخضر، أزرق، نيلي، بنفسجي. تحفظ بالجملة الشهيرة عن أول حرف من كل لون."}, {"q": "ما أكبر دول العالم مساحة؟", "o": ["الصين", "كندا", "روسيا", "الولايات المتحدة"], "a": 2, "e": "روسيا أكبر دول العالم مساحة (نحو 17 مليون كم²)، تليها كندا ثم الصين والولايات المتحدة."}, {"q": "ما أكبر صحراء حارة في العالم؟", "o": ["صحراء الربع الخالي", "الصحراء الكبرى", "صحراء جوبي", "صحراء كلهاري"], "a": 1, "e": "الصحراء الكبرى في شمال أفريقيا أكبر صحراء حارة في العالم، تمر عبر 11 دولة بينها مصر وليبيا والجزائر."}, {"q": "ما القناة التي تربط البحر المتوسط بالبحر الأحمر؟", "o": ["قناة بنما", "قناة السويس", "مضيق جبل طارق", "مضيق هرمز"], "a": 1, "e": "قناة السويس افتتحت عام 1869 وتربط المتوسط بالبحر الأحمر، فتختصر رحلة السفن بين أوروبا وآسيا دون الدوران حول أفريقيا."}, {"q": "أي وحدة قياس طول أصغر؟", "o": ["السنتيمتر", "المليمتر", "الديسيمتر", "المتر"], "a": 1, "e": "المليمتر أصغر الوحدات المذكورة: المتر 100 سم، والسنتيمتر 10 ملم. الترتيب من الأكبر: متر، ديسيمتر، سنتيمتر، مليمتر."}, {"q": "السرعة تساوي:", "o": ["المسافة × الزمن", "المسافة ÷ الزمن", "الزمن ÷ المسافة", "المسافة + الزمن"], "a": 1, "e": "السرعة = المسافة مقسومة على الزمن. سيارة قطعت 100 كم في ساعتين سرعتها 50 كم/ساعة."}, {"q": "كم مجموع زوايا المثلث الداخلية؟", "o": ["90 درجة", "180 درجة", "270 درجة", "360 درجة"], "a": 1, "e": "مجموع زوايا أي مثلث 180 درجة، بينما مجموع زوايا الشكل الرباعي 360 درجة."}, {"q": "ما القيمة التقريبية للنسبة الثابتة ط (باي)؟", "o": ["2.14", "3.14", "4.13", "1.41"], "a": 1, "e": "ط ≈ 3.14 وهي نسبة محيط الدائرة إلى قطرها، ثابتة لأي دائرة مهما كان حجمها."}, {"q": "ما الرمز الكيميائي للأكسجين؟", "o": ["Ox", "O", "O2 فقط", "Og"], "a": 1, "e": "رمز عنصر الأكسجين O. أما O2 فهو جزيء غاز الأكسجين المكوّن من ذرتين، والرموز الكيميائية حرف أو حرفان الأول كبير."}, {"q": "الصيغة الكيميائية H2O هي صيغة:", "o": ["الملح", "الماء", "الأكسجين", "ثاني أكسيد الكربون"], "a": 1, "e": "H2O جزيء الماء: ذرتا هيدروجين وذرة أكسجين. الملح NaCl وثاني أكسيد الكربون CO2."}, {"q": "ما أكبر عضو في جسم الإنسان؟", "o": ["الكبد", "الجلد", "الرئة", "القلب"], "a": 1, "e": "الجلد أكبر أعضاء الجسم (نحو 2 متر مربع)، يحمي الجسم وينظم حرارته. الكبد أكبر الأعضاء الداخلية."}, {"q": "ما أطول عظمة في جسم الإنسان؟", "o": ["عظمة العضد", "عظمة الفخذ", "عظمة الساق", "عظمة العمود الفقري"], "a": 1, "e": "عظمة الفخذ أطول وأقوى عظام الجسم، تمتد من الحوض إلى الركبة."}, {"q": "كم عدد عظام جسم الإنسان البالغ تقريبًا؟", "o": ["106", "206", "306", "406"], "a": 1, "e": "جسم البالغ 206 عظمة. يولد الطفل بنحو 300 عظمة تلتحم كثير منها مع النمو."}, {"q": "أي فيتامين يصنعه الجسم بتعرض الجلد لأشعة الشمس؟", "o": ["فيتامين A", "فيتامين C", "فيتامين D", "فيتامين B12"], "a": 2, "e": "فيتامين D يسمى «فيتامين الشمس»، مهم لصحة العظام وامتصاص الكالسيوم، ويوجد أيضًا في الأسماك والبيض."}, {"q": "كم عدد لاعبي فريق كرة القدم داخل الملعب؟", "o": ["9", "10", "11", "12"], "a": 2, "e": "كل فريق كرة قدم 11 لاعبًا بينهم حارس المرمى. كرة السلة 5 لاعبين، والكرة الطائرة 6."}, {"q": "كم عدد لاعبي فريق كرة السلة داخل الملعب؟", "o": ["5", "6", "7", "11"], "a": 0, "e": "فريق كرة السلة 5 لاعبين داخل الملعب مع بدلاء على الدكة. كرة القدم 11 والطائرة 6."}, {"q": "أين أقيمت أول دورة أولمبية حديثة عام 1896؟", "o": ["روما", "باريس", "أثينا", "لندن"], "a": 2, "e": "أول أولمبياد حديثة أقيم في أثينا باليونان عام 1896، إحياءً للألعاب اليونانية القديمة في أولمبيا."}, {"q": "ما أكبر حيوان يعيش على الأرض؟", "o": ["الفيل الأفريقي", "الحوت الأزرق", "الزرافة", "وحيد القرن"], "a": 1, "e": "الحوت الأزرق أكبر حيوان عرفته الأرض على الإطلاق، يتجاوز 30 مترًا وقد يفوق وزنه 150 طنًا."}, {"q": "ما أسرع حيوان بري؟", "o": ["الأسد", "الغزال", "الفهد", "الحصان"], "a": 2, "e": "الفهد أسرع حيوان بري، يتجاوز 100 كم/ساعة في انطلاقات قصيرة لصيد الفريسة."}, {"q": "أي طائر لا يستطيع الطيران؟", "o": ["الصقر", "النعامة", "البومة", "الحمامة"], "a": 1, "e": "النعامة أكبر طائر حي ولا تطير، لكنها تجري بسرعة كبيرة. من الطيور العاجزة أيضًا: البطريق والكيوي."}, {"q": "كم عدد أرجل العنكبوت؟", "o": ["6", "8", "10", "4"], "a": 1, "e": "العنكبوت من العنكبيات وله 8 أرجل، بينما الحشرات لها 6 أرجل. هذا أسهل فرق بينهما."}], "behavioral": [{"q": "في مقابلة عمل، سألك المدير: «حدثني عن نفسك». ما أفضل رد؟", "o": ["أروي قصة حياتي كاملة منذ الطفولة", "ملخص مهني مركز: خبرتي ومهاراتي وما يقدمني للوظيفة المطلوبة في دقيقة-دقيقتين", "أقول إن كل شيء مكتوب في السيرة الذاتية", "أسأله هو عن نفسه أولًا"], "a": 1, "e": "السؤال فرصة لتقديم ملخص مهني موجه: خلفيتك، أبرز إنجازاتك، ولماذا أنت مناسب لهذه الوظيفة تحديدًا. التفاصيل الشخصية الطويلة تشتت وتضعف الانطباع."}, {"q": "سؤال «ما أكبر نقطة ضعف فيك؟» — ما الإجابة الذكية؟", "o": ["«ليس لدي أي نقاط ضعف»", "ذكر ضعف حقيقي غير قاتل للوظيفة مع شرح ما تفعله لتحسينه", "ذكر صفة تسيء للوظيفة مباشرة مثل «أتأخر دائمًا»", "الاعتذار ورفض الإجابة"], "a": 1, "e": "الصيغة المقبولة: ضعف حقيقي + وعي به + خطة تحسين ملموسة. «ليس لدي نقاط ضعف» توحي بعدم صدق، والضعف القاتل للوظيفة يستبعدك."}, {"q": "اكتشفت أن زميلك ارتكب خطأ في تقرير سيُرفع للإدارة اليوم. ما التصرف المهني؟", "o": ["أتجاهل، فهذا ليس عملي", "أبلغ المدير فورًا لأحصل على تقدير", "أخبر الزميل بهدوء وأعرض المساعدة في تصحيحه قبل الرفع", "أصلحه وأخفيه عنه"], "a": 2, "e": "المصلحة المشتركة هي تقرير صحيح بلا حرج لأحد: تنبيه الزميل مباشرة يحل المشكلة ويحفظ العلاقة. التصعيد الفوري دون إنذار يهدم الثقة، والتجاهل يضر العمل."}, {"q": "أسلوب STAR في الإجابة عن أسئلة المقابلات يعني:", "o": ["التحدث بثقة عالية فقط", "Situation ثم Task ثم Action ثم Result: الموقف والمهمة والإجراء والنتيجة", "مديح النفس بأسلوب قصصي", "الإجابة بجمل قصيرة جدًا"], "a": 1, "e": "STAR هيكل لرواية إنجازاتك: صف الموقف، مهمتك فيه، ما فعلته أنت تحديدًا، والنتيجة المقاسة. يجعل إجاباتك ملموسة ومقنعة بدل العموميات."}, {"q": "أعطاك مديرك مهمة بموعد تسليم تعرف أنه غير واقعي. ما التصرف الأفضل؟", "o": ["أقبل وأصمت ثم أتأخر", "أرفض المهمة علنًا أمام الزملاء", "أوضح بهدوء ما يمكن إنجازه واقعيًا واقترح أولويات أو موعدًا بديلًا", "أنجز نصفها وأختفي"], "a": 2, "e": "الاحترافية توازن بين عدم الوعد الفارغ وعدم الرفض الجاف: اعرض الحقائق (الوقت والموارد)، اسأل عن الأولويات، واقترح حلًا. هذا يبني ثقة أكثر من القبول ثم الفشل."}, {"q": "ما أفضل تعريف للذكاء العاطفي في بيئة العمل؟", "o": ["إخفاء كل المشاعر", "فهم مشاعرك ومشاعر الآخرين وإدارتها لتحسين التعامل والقرارات", "التمثيل والمجاملة", "تجنب أي خلاف بأي ثمن"], "a": 1, "e": "الذكاء العاطفي يشمل الوعي الذاتي وضبط الانفعالات والتعاطف والمهارات الاجتماعية. لا يعني قمع المشاعر ولا تجنب الخلاف، بل إدارتهما بشكل بنّاء."}, {"q": "زميل يتحدث إليك بحدة أمام الفريق. ما رد الفعل الأنضج؟", "o": ["أرد بنفس الحدة فورًا لأحفظ كرامتي", "أهدئ الموقف برد مهني مختصر وأناقش الأمر معه على انفراد لاحقًا", "أشتكيه لكل الزملاء", "أتجاهله أسابيع"], "a": 1, "e": "الانفعال العلني يخسرك حتى لو كنت محقًا. رد هادئ مثل «نقطة مهمة، نكملها بعد الاجتماع» يحفظ الموقف، والحوار الفردي بعدها يعالج الجذر."}, {"q": "سُئلت في مقابلة: «لماذا تركت وظيفتك السابقة؟» وكان مديرك السابق سيئًا. ماذا تقول؟", "o": ["أشرح بالتفصيل عيوب المدير السابق", "إجابة إيجابية محايدة تركز على طموحي للنمو وتطوير مهاراتي", "أكذب وأقول إن الشركة أغلقت", "أرفض الإجابة"], "a": 1, "e": "الإساءة لجهة سابقة توحي بأنك ستسيء لهم لاحقًا. الصيغة الآمنة: التركيز على ما تبحث عنه مستقبلًا (نمو، تحدٍ جديد) دون هجوم ودون كذب قابل للكشف."}, {"q": "ما الفرق بين العمل الجاد والعمل الذكي؟", "o": ["لا فرق", "العمل الذكي يحقق الهدف بأقل جهد مهدور عبر التخطيط والأولويات والأدوات", "العمل الجاد دائمًا أفضل", "الذكي يعني تجنب العمل"], "a": 1, "e": "ساعات طويلة بلا ترتيب أولويات قد تنتج أقل من ساعات أقل بخطة واضحة وأدوات مناسبة (كأتمتة مهمة متكررة). الأفضل: جهد مركز على ما يحرك النتيجة."}, {"q": "طلب منك مديرك شيئًا تعتقد أنه خطأ فني سيضر المشروع. ماذا تفعل؟", "o": ["أنفذ كما طُلب، فهو المدير", "أرفض التنفيذ نهائيًا", "أعرض وجهة نظري بالأدلة والبدائل، ثم أنفذ قراره بعد توثيق ملاحظتي", "أنفذ عكس طلبه سرًا"], "a": 2, "e": "واجبك المهني إيصال المعلومة والتحذير بالأدلة واقتراح بديل، لكن القرار النهائي للمسؤول. التنفيذ العكسي خيانة للثقة، والصمت تواطؤ في خطأ متوقع."}, {"q": "ما المقصود بأخذ المبادرة (Initiative) في العمل؟", "o": ["انتظار الأوامر بدقة", "ملاحظة ما يحتاج إنجازًا والبدء فيه دون أن يُطلب منك، ضمن صلاحياتك", "عمل مهام زملائك بدلًا منهم", "رفع صوتك في الاجتماعات"], "a": 1, "e": "المبادرة أن ترى مشكلة أو فرصة وتتحرك نحوها: تقترح تحسينًا، تجهز تقريرًا قبل طلبه، تساعد فريقًا مضغوطًا. وهي من أكثر الصفات التي يبحث عنها المديرون."}, {"q": "كيف تتعامل مع تعدد المهام وضغط المواعيد؟", "o": ["أعمل على كل شيء في نفس اللحظة", "أرتب الأولويات حسب الأهمية والاستعجال وأنجزها تباعًا مع تواصل مبكر عن أي تعثر", "أنجز الأسهل أولًا دائمًا", "أطلب إلغاء نصف المهام"], "a": 1, "e": "مصفوفة الأولويات (مهم/عاجل) أداة عملية: المهم العاجل أولًا، والمهم غير العاجل يُجدوَل. والأهم: إن رأيت تعثرًا قادمًا، أخبر أصحاب المصلحة مبكرًا لا في يوم التسليم."}, {"q": "ما أفضل رد عندما لا تعرف إجابة سؤال تقني في مقابلة؟", "o": ["أخترع إجابة بثقة", "أعترف بأني لا أعرف مع توضيح كيف سأبحث عن الإجابة أو ما أعرفه حول الموضوع", "أسكت تمامًا", "أغير الموضوع فورًا"], "a": 1, "e": "الصدق مع منهجية يكسب احترامًا أكثر من التلفيق الذي يُكشف بسؤال متابعة واحد. قل: «لم أعمل على هذا مباشرة، لكن منطقيًا سأتعامل معه هكذا...»"}, {"q": "زميل جديد يعاني لفهم نظام العمل ولا أحد يساعده. ما التصرف الإيجابي؟", "o": ["أتركه يتعلم بنفسه كما تعلمنا", "أخصص وقتًا قصيرًا لأشرح له الأساسيات وأدله على المصادر", "أبلغ المدير أنه بطيء", "أتجاهله فليس من مسؤوليتي"], "a": 1, "e": "مساعدة الزملاء الجدد تبني روح الفريق وتنعكس عليك سمعة وقيادة. شرح الأساسيات لا يأخذ وقتًا كبيرًا ويوفر على الفريق أخطاء مستقبلية."}, {"q": "ما المقصود بالتغذية الراجعة البنّاءة (Constructive Feedback)؟", "o": ["النقد العام أمام الجميع", "ملاحظات محددة عن السلوك لا الشخص، مع اقتراح تحسين، في وقت ومكان مناسبين", "المجاملة الدائمة", "تجنب قول أي ملاحظة سلبية"], "a": 1, "e": "القاعدة: صف السلوك وأثره واقترح البديل: «التقرير وصل بعد الموعد مرتين، وهذا أخر الفريق، نتفق على تنبيه مبكر لو حصل تأخر؟» — لا أحكام شخصية ولا عموميات مثل «أنت مهمل»."}, {"q": "تلقيت نقدًا قاسيًا من مديرك أمام زملائك وتشعر أن جزءًا منه غير عادل. ماذا تفعل؟", "o": ["أرد بانفعال وأدافع فورًا أمام الجميع", "أمتص الموقف بهدوء، وأطلب لقاءً فرديًا لاحقًا لمناقشة النقاط بموضوعية", "أقدم استقالتي في اليوم نفسه", "أتجاهل الملاحظات كلها"], "a": 1, "e": "المناقشة الانفعالية العلنية نادرًا ما تخدمك. خذ ما في النقد من صواب، واطلب جلسة هادئة لتوضيح سوء الفهم بالحقائق. هذا يظهر نضجًا ولا يعني القبول الأعمى."}, {"q": "ما أفضل تحضير لمقابلة عمل قادمة؟", "o": ["الاعتماد على الارتجال", "دراسة الشركة والوظيفة، وتجهيز أمثلة STAR لإنجازاتي، والتدرب على الأسئلة الشائعة", "حفظ إجابات جاهزة من الإنترنت حرفيًا", "الاهتمام بالملابس فقط"], "a": 1, "e": "التحضير الجاد: اقرأ عن الشركة ومنتجاتها وأخبارها، طابق مهاراتك مع متطلبات الإعلان، جهز 4-6 قصص إنجاز بأسلوب STAR، وجهز أسئلة ذكية تسألها أنت في النهاية."}, {"q": "في نهاية المقابلة سألوك: «هل لديك أسئلة لنا؟» — ما الأفضل؟", "o": ["«لا، شكرًا، كل شيء واضح»", "أسئلة ذكية عن طبيعة النجاح في الدور والفريق وأولويات أول 90 يومًا", "أسأل عن الإجازات والراتب فقط", "أسأل أسئلة شخصية عن المدير"], "a": 1, "e": "سؤالك يكشف اهتمامك الحقيقي: «كيف تقيسون نجاح شاغل هذا الدور بعد 6 أشهر؟» سؤال يميزك. «لا أسئلة» توحي بفتور، وحصر الحديث في المميزات يترك انطباعًا ضيقًا."}, {"q": "ما المقصود بمهارة إدارة الوقت؟ وما أشهر أداة لها؟", "o": ["العمل ليلًا لتعويض النهار", "تخطيط اليوم بأولويات واضحة وتقسيم المهام الكبيرة، وأشهر الأدوات قائمة مهام ومصفوفة أيزنهاور", "الاستغناء عن النوم", "تعدد المهام المستمر"], "a": 1, "e": "إدارة الوقت تبدأ بمعرفة أين يذهب وقتك، ثم تخطيط اليوم بثلاث أولويات قصوى، وتقسيم المهام الكبيرة لخطوات. تعدد المهام المستمر ثبت أنه يقلل التركيز والجودة."}, {"q": "عندما يخطئ عميل في حقك ويتهمك بالتقصير ظلمًا، ما التصرف المهني؟", "o": ["أثبت غلطه بحدة لأنني المظلوم", "أستمع كاملًا دون مقاطعة، أعتذر عن انزعاجه، ثم أوضح الحقائق بهدوء وأقدم حلًا", "أتجاهل رسائله حتى يهدأ", "أحوله لزميل فورًا"], "a": 1, "e": "الغاضب يحتاج أولًا أن يُسمع. الاستماع ثم الاعتذار عن المشاعر (لا عن خطأ لم يحدث) يهدئ الموقف، وبعدها تعرض الحقائق والحل. الهدف حل المشكلة لا الفوز بالجدال."}, {"q": "ما الفرق بين القائد والمدير؟", "o": ["لا فرق إطلاقًا", "المدير يدير العمليات والصلاحيات، والقائد يلهم الناس ويؤثر فيهم ولو بلا منصب", "القائد أعلى راتبًا دائمًا", "المدير لا يحتاج مهارات"], "a": 1, "e": "الإدارة وظيفة وصلاحيات، والقيادة سلوك: التأثير والإلهام وتحمل المسؤولية. يمكن أن تقود من أي موقع بمبادرتك ومثالك، ويمكن أن يكون مدير بلا صفات قيادية."}, {"q": "كيف تتعامل مع زميل لا ينجز جزءه من عمل مشترك فيقترب موعد التسليم؟", "o": ["أنجز جزءه بصمت كل مرة", "أتحدث معه مباشرة لأفهم السبب وأعرض المساعدة، وإن تكرر أوضحت الأثر ورفعت الأمر للمسؤول بالحقائق", "أفضحه في مجموعة العمل", "أنسحب من المشروع"], "a": 1, "e": "الحوار المباشر أولًا: ربما يواج   why.innerHTML = '<b>' + head + '</b><br>' + q.e;
  why.classList.add('show');
  document.getElementById('running').textContent = 'صحيحة حتى الآن: ' + score;
  const nb = document.getElementById('nextbtn');
  nb.textContent = (i + 1 < qs.length) ? 'السؤال التالي' : 'عرض النتيجة';
  nb.classList.add('show');
}
function next() {
  if (i + 1 < qs.length) { i++; render(); }
  else {
    document.getElementById('prog').style.width = '100%';
    document.getElementById('scorenum').textContent = score + ' من ' + qs.length;
    const p = score / qs.length;
    let m;
    if (p >= .9) m = 'ممتاز! مستواك قوي جدًا في هذا القسم 🌟';
    else if (p >= .7) m = 'جيد جدًا — راجع الأسئلة اللي غلطت فيها وهتتقن القسم 💪';
    else if (p >= .5) m = 'أساس كويس — أعد المحاولة وركّز على الشروحات 📚';
    else m = 'بداية طيبة — اقرأ الشروحات بتمعن وحاول مرة أخرى، التكرار يعلّم 🔁';
    document.getElementById('scoremsg').textContent = m;
    show('result');
  }
}
function restart(same) { if (same) start(cur); else show('home'); }
</script>
</body>
</html>
