<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبر نفسك — أسئلة تدريبية بالتصحيح الفوري</title>
<style>
  :root { --green:#0b5830; --green2:#107c41; --bg:#f6fbf8; --cream:#f5f0e1; --red:#c81e1e; --ink:#1c2b23; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  header { text-align:center; padding:22px 0 8px; }
  header .logo { display:inline-block; background:var(--green); color:var(--cream); padding:8px 22px; border-radius:40px; font-weight:bold; font-size:20px; }
  header p { color:#5a6b60; margin-top:10px; font-size:15px; }
  .card { background:#fff; border-radius:18px; box-shadow:0 4px 18px rgba(11,88,48,.08); padding:26px 22px; margin-top:20px; }
  .sec-btn { display:block; width:100%; text-align:right; background:var(--bg); border:2px solid #dce9e0; border-radius:14px; padding:18px; margin-top:14px; cursor:pointer; font-size:17px; font-weight:bold; color:var(--ink); transition:.15s; }
  .sec-btn:hover { border-color:var(--green2); background:#eef7f1; }
  .sec-btn small { display:block; font-weight:normal; color:#5a6b60; margin-top:6px; font-size:13px; }
  .meta { display:flex; justify-content:space-between; color:#5a6b60; font-size:14px; margin-bottom:14px; }
  .bar { height:8px; background:#e4efe8; border-radius:6px; overflow:hidden; margin-bottom:20px; }
  .bar div { height:100%; background:var(--green2); width:0%; transition:width .3s; }
  .q { font-size:19px; font-weight:bold; line-height:1.7; margin-bottom:18px; }
  .opt { display:block; width:100%; text-align:right; background:var(--bg); border:2px solid #dce9e0; border-radius:12px; padding:14px 16px; margin-top:10px; cursor:pointer; font-size:16px; line-height:1.6; transition:.15s; }
  .opt:hover:not(:disabled) { border-color:var(--green2); }
  .opt:disabled { cursor:default; opacity:.85; }
  .opt.right { background:#e6f6ec; border-color:var(--green2); color:var(--green); font-weight:bold; }
  .opt.wrong { background:#fbeaea; border-color:var(--red); color:var(--red); }
  .why { display:none; margin-top:16px; background:#fff8e8; border-right:4px solid #d9a400; border-radius:10px; padding:14px 16px; font-size:15px; line-height:1.8; }
  .why.show { display:block; }
  .why b { color:#8a6500; }
  .next { display:none; width:100%; margin-top:18px; background:var(--green); color:#fff; border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:bold; cursor:pointer; }
  .next.show { display:block; }
  .score-big { font-size:52px; font-weight:bold; color:var(--green); text-align:center; }
  .score-sub { text-align:center; color:#5a6b60; margin:10px 0 18px; font-size:16px; }
  .again { display:block; width:100%; background:var(--green); color:#fff; border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:10px; }
  .ghost { display:block; width:100%; background:#fff; color:var(--green); border:2px solid var(--green); border-radius:12px; padding:13px; font-size:16px; cursor:pointer; margin-top:10px; }
  footer { text-align:center; color:#8a9a90; font-size:13px; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">اختبر نفسك</span>
    <p>أسئلة تدريبية بالتصحيح الفوري وشرح الإجابة — للمدارس والشغل</p>
  </header>

  <div class="card" id="home">
    <div style="font-size:17px;font-weight:bold;">اختر القسم:</div>
    <button class="sec-btn" onclick="start('computing')">💻 حاسب آلي وتكنولوجيا<small>أساسيات الكمبيوتر والإنترنت والأمان وإكسل والبرمجة والاختبار — 50 سؤال</small></button>
    <button class="sec-btn" onclick="start('behavioral')">💼 انترفيوهات ومهارات سلوكية<small>مواقف العمل والمقابلات الشخصية والتواصل وإدارة الوقت — 50 سؤال</small></button>
  </div>

  <div class="card" id="quiz" style="display:none;">
    <div class="meta"><span id="counter"></span><span id="running"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <button class="next" id="nextbtn" onclick="next()"></button>
  </div>

  <div class="card" id="result" style="display:none;">
    <div class="score-big" id="scorenum"></div>
    <div class="score-sub" id="scoremsg"></div>
    <button class="again" onclick="restart(true)">إعادة نفس القسم</button>
    <button class="ghost" onclick="restart(false)">اختيار قسم آخر</button>
  </div>

  <footer>نسخة تجريبية للتعلم الذاتي، وليست اختبارًا رسميًا. إجابات المواقف السلوكية إرشادية وقد تختلف حسب السياق.</footer>
</div>

<script>
const BANKS = {"computing": [{"q": "ما وظيفة وحدة المعالجة المركزية (CPU) في الكمبيوتر؟", "o": ["تخزين الملفات بشكل دائم", "تنفيذ التعليمات ومعالجة البيانات", "عرض الصور على الشاشة", "الاتصال بالإنترنت"], "a": 1, "e": "الـ CPU هي عقل الكمبيوتر: تنفذ التعليمات وتعالج البيانات. التخزين الدائم وظيفة القرص الصلب، والعرض وظيفة كارت الشاشة."}, {"q": "أي مما يلي يعتبر ذاكرة مؤقتة تفقد محتواها عند إطفاء الجهاز؟", "o": ["القرص الصلب HDD", "ذاكرة الوصول العشوائي RAM", "الفلاش ميموري", "القرص SSD"], "a": 1, "e": "الـ RAM ذاكرة مؤقتة سريعة تعمل أثناء تشغيل الجهاز فقط وتُمسح عند إطفائه، عكس وسائط التخزين الدائمة."}, {"q": "ما الفرق الأساسي بين نظام التشغيل والبرنامج التطبيقي؟", "o": ["لا يوجد فرق", "نظام التشغيل يدير موارد الجهاز ويشغّل البرامج، والتطبيق يؤدي مهمة محددة للمستخدم", "نظام التشغيل للألعاب فقط", "التطبيق يعمل بدون نظام تشغيل"], "a": 1, "e": "نظام التشغيل (مثل Windows) هو الوسيط الذي يدير الجهاز ويوفر بيئة عمل البرامج، أما التطبيق (مثل Word) فيؤدي مهمة محددة ويعمل فوق نظام التشغيل."}, {"q": "ماذا يعني اختصار URL؟", "o": ["Uniform Resource Locator — عنوان مورد على الإنترنت", "Universal Remote Link — رابط تحكم عن بعد", "User Registration Login — تسجيل دخول", "Unified Routing Language — لغة توجيه"], "a": 0, "e": "URL هو العنوان الكامل لصفحة أو ملف على الإنترنت، مثل https://example.com/page."}, {"q": "أي بروتوكول يُستخدم لتصفح صفحات الويب بشكل مشفر وآمن؟", "o": ["HTTP", "FTP", "HTTPS", "SMTP"], "a": 2, "e": "HTTPS هو النسخة المشفرة من HTTP، وتظهر كقفل بجانب العنوان. SMTP للبريد الإلكتروني وFTP لنقل الملفات."}, {"q": "ما وظيفة كلمة المرور القوية؟ وما أفضل صيغة لها؟", "o": ["اسمك وتاريخ ميلادك لسهولة التذكر", "123456 لأنها شائعة", "مزيج طويل من حروف وأرقام ورموز مختلف لكل حساب", "كلمة واحدة من القاموس"], "a": 2, "e": "كلمة المرور القوية طويلة (12+ حرف) وتجمع حروف كبيرة وصغيرة وأرقام ورموز، وتكون مختلفة لكل حساب. المعلومات الشخصية والكلمات الشائعة يسهل تخمينها."}, {"q": "ما هو التصيد الاحتيالي (Phishing)؟", "o": ["برنامج مضاد للفيروسات", "رسائل مزيفة تنتحل جهة موثوقة لسرقة بياناتك", "طريقة لتسريع الإنترنت", "نوع من أنواع الطابعات"], "a": 1, "e": "التصيد رسائل أو مواقع مزيفة تدّعي أنها بنك أو جهة رسمية لتسرق كلمات المرور والبيانات. القاعدة: لا تضغط روابط الرسائل المجهولة وتحقق من العنوان بنفسك."}, {"q": "في برنامج Excel، ماذا تفعل الدالة SUM؟", "o": ["تطرح الخلايا", "تجمع قيم نطاق من الخلايا", "تحسب المتوسط فقط", "ترتب الخلايا أبجديًا"], "a": 1, "e": "SUM تجمع قيم الخلايا، مثل =SUM(A1:A10) لجمع الخلايا من A1 إلى A10. المتوسط دالتها AVERAGE."}, {"q": "في Excel، ماذا يعني المرجع $A$1 في المعادلة؟", "o": ["خطأ في الكتابة", "مرجع مطلوب (ثابت) لا يتغير عند نسخ المعادلة", "مرجع لورقة أخرى", "عملة الدولار"], "a": 1, "e": "علامة $ تجعل المرجع مطلقًا: عند نسخ المعادلة لخلايا أخرى يظل يشير لـ A1 نفسها، وهو مفيد للثوابت مثل نسبة الضريبة."}, {"q": "ما وظيفة الاختصار Ctrl+S في معظم البرامج؟", "o": ["إغلاق البرنامج", "حفظ الملف", "طباعة المستند", "نسخ نص"], "a": 1, "e": "Ctrl+S يحفظ الملف الحالي. Ctrl+C للنسخ وCtrl+P للطباعة."}, {"q": "ما الفرق بين البيانات والمعلومات؟", "o": ["لا فرق بينهما", "البيانات حقائق خام، والمعلومات بيانات معالجة ذات معنى", "المعلومات أرقام فقط", "البيانات موجودة في الكتب فقط"], "a": 1, "e": "البيانات خام غير مرتب (أرقام مبيعات يومية)، والمعلومات ناتج معالجتها وترتيبها لتفيد قرارًا (تقرير أفضل شهر مبيعات)."}, {"q": "ما المقصود بقاعدة البيانات؟", "o": ["مجلد صور على الجهاز", "مجموعة منظمة من البيانات المترابطة يمكن البحث فيها وتحديثها", "نوع من الشاشات", "موقع إلكتروني"], "a": 1, "e": "قاعدة البيانات نظام منظم لتخزين بيانات مترابطة (كجدول العملاء وطلباتهم) مع إمكانية البحث والتحديث والتقارير بكفاءة."}, {"q": "ما وظيفة لغة SQL؟", "o": ["تصميم الصور", "الاستعلام عن البيانات وإدارتها في قواعد البيانات", "تشغيل الألعاب", "ضغط الملفات"], "a": 1, "e": "SQL لغة قياسية للتعامل مع قواعد البيانات: SELECT للاستعلام، INSERT للإضافة، UPDATE للتعديل، DELETE للحذف."}, {"q": "في البرمجة، ما المقصود بالمتغير (Variable)؟", "o": ["خطأ في الكود", "مساحة في الذاكرة لها اسم وتخزن قيمة قابلة للتغيير", "نوع طابعة", "ملف صوتي"], "a": 1, "e": "المتغي عيد الفوري دون إنذار يهدم الثقة، والتجاهل يضر العمل."}, {"q": "أسلوب STAR في الإجابة عن أسئلة المقابلات يعني:", "o": ["التحدث بثقة عالية فقط", "Situation ثم Task ثم Action ثم Result: الموقف والمهمة والإجراء والنتيجة", "مديح النفس بأسلوب قصصي", "الإجابة بجمل قصيرة جدًا"], "a": 1, "e": "STAR هيكل لرواية إنجازاتك: صف الموقف، مهمتك فيه، ما فعلته أنت تحديدًا، والنتيجة المقاسة. يجعل إجاباتك ملموسة ومقنعة بدل العموميات."}, {"q": "أعطاك مديرك مهمة بموعد تسليم تعرف أنه غير واقعي. ما التصرف الأفضل؟", "o": ["أقبل وأصمت ثم أتأخر", "أرفض المهمة علنًا أمام الزملاء", "أوضح بهدوء ما يمكن إنجازه واقعيًا واقترح أولويات أو موعدًا بديلًا", "أنجز نصفها وأختفي"], "a": 2, "e": "الاحترافية توازن بين عدم الوعد الفارغ وعدم الرفض الجاف: اعرض الحقائق (الوقت والموارد)، اسأل عن الأولويات، واقترح حلًا. هذا يبني ثقة أكثر من القبول ثم الفشل."}, {"q": "ما أفضل تعريف للذكاء العاطفي في بيئة العمل؟", "o": ["إخفاء كل المشاعر", "فهم مشاعرك ومشاعر الآخرين وإدارتها لتحسين التعامل والقرارات", "التمثيل والمجاملة", "تجنب أي خلاف بأي ثمن"], "a": 1, "e": "الذكاء العاطفي يشمل الوعي الذاتي وضبط الانفعالات والتعاطف والمهارات الاجتماعية. لا يعني قمع المشاعر ولا تجنب الخلاف، بل إدارتهما بشكل بنّاء."}, {"q": "زميل يتحدث إليك بحدة أمام الفريق. ما رد الفعل الأنضج؟", "o": ["أرد بنفس الحدة فورًا لأحفظ كرامتي", "أهدئ الموقف برد مهني مختصر وأناقش الأمر معه على انفراد لاحقًا", "أشتكيه لكل الزملاء", "أتجاهله أسابيع"], "a": 1, "e": "الانفعال العلني يخسرك حتى لو كنت محقًا. رد هادئ مثل «نقطة مهمة، نكملها بعد الاجتماع» يحفظ الموقف، والحوار الفردي بعدها يعالج الجذر."}, {"q": "سُئلت في مقابلة: «لماذا تركت وظيفتك السابقة؟» وكان مديرك السابق سيئًا. ماذا تقول؟", "o": ["أشرح بالتفصيل عيوب المدير السابق", "إجابة إيجابية محايدة تركز على طموحي للنمو وتطوير مهاراتي", "أكذب وأقول إن الشركة أغلقت", "أرفض الإجابة"], "a": 1, "e": "الإساءة لجهة سابقة توحي بأنك ستسيء لهم لاحقًا. الصيغة الآمنة: التركيز على ما تبحث عنه مستقبلًا (نمو، تحدٍ جديد) دون هجوم ودون كذب قابل للكشف."}, {"q": "ما الفرق بين العمل الجاد والعمل الذكي؟", "o": ["لا فرق", "العمل الذكي يحقق الهدف بأقل جهد مهدور عبر التخطيط والأولويات والأدوات", "العمل الجاد دائمًا أفضل", "الذكي يعني تجنب العمل"], "a": 1, "e": "ساعات طويلة بلا ترتيب أولويات قد تنتج أقل من ساعات أقل بخطة واضحة وأدوات مناسبة (كأتمتة مهمة متكررة). الأفضل: جهد مركز على ما يحرك النتيجة."}, {"q": "طلب منك مديرك شيئًا تعتقد أنه خطأ فني سيضر المشروع. ماذا تفعل؟", "o": ["أنفذ كما طُلب، فهو المدير", "أرفض التنفيذ نهائيًا", "أعرض وجهة نظري بالأدلة والبدائل، ثم أنفذ قراره بعد توثيق ملاحظتي", "أنفذ عكس طلبه سرًا"], "a": 2, "e": "واجبك المهني إيصال المعلومة والتحذير بالأدلة واقتراح بديل، لكن القرار النهائي للمسؤول. التنفيذ العكسي خيانة للثقة، والصمت تواطؤ في خطأ متوقع."}, {"q": "ما المقصود بأخذ المبادرة (Initiative) في العمل؟", "o": ["انتظار الأوامر بدقة", "ملاحظة ما يحتاج إنجازًا والبدء فيه دون أن يُطلب منك، ضمن صلاحياتك", "عمل مهام زملائك بدلًا منهم", "رفع صوتك في الاجتماعات"], "a": 1, "e": "المبادرة أن ترى مشكلة أو فرصة وتتحرك نحوها: تقترح تحسينًا، تجهز تقريرًا قبل طلبه، تساعد فريقًا مضغوطًا. وهي من أكثر الصفات التي يبحث عنها المديرون."}, {"q": "كيف تتعامل مع تعدد المهام وضغط المواعيد؟", "o": ["أعمل على كل شيء في نفس اللحظة", "أرتب الأولويات حسب الأهمية والاستعجال وأنجزها تباعًا مع تواصل مبكر عن أي تعثر", "أنجز الأسهل أولًا دائمًا", "أطلب إلغاء نصف المهام"], "a": 1, "e": "مصفوفة الأولويات (مهم/عاجل) أداة عملية: المهم العاجل أولًا، والمهم غير العاجل يُجدوَل. والأهم: إن رأيت تعثرًا قادمًا، أخبر أصحاب المصلحة مبكرًا لا في يوم التسليم."}, {"q": "ما أفضل رد عندما لا تعرف إجابة سؤال تقني في مقابلة؟", "o": ["أخترع إجابة بثقة", "أعترف بأني لا أعرف مع توضيح كيف سأبحث عن الإجابة أو ما أعرفه حول الموضوع", "أسكت تمامًا", "أغير الموضوع فورًا"], "a": 1, "e": "الصدق مع منهجية يكسب احترامًا أكثر من التلفيق الذي يُكشف بسؤال متابعة واحد. قل: «لم أعمل على هذا مباشرة، لكن منطقيًا سأتعامل معه هكذا...»"}, {"q": "زميل جديد يعاني لفهم نظام العمل ولا أحد يساعده. ما التصرف الإيجابي؟", "o": ["أتركه يتعلم بنفسه كما تعلمنا", "أخصص وقتًا قصيرًا لأشرح له الأساسيات وأدله على المصادر", "أبلغ المدير أنه بطيء", "أتجاهله فليس من مسؤوليتي"], "a": 1, "e": "مساعدة الزملاء الجدد تبني روح الفريق وتنعكس عليك سمعة وقيادة. شرح الأساسيات لا يأخذ وقتًا كبيرًا ويوفر على الفريق أخطاء مستقبلية."}, {"q": "ما المقصود بالتغذية الراجعة البنّاءة (Constructive Feedback)؟", "o": ["النقد العام أمام الجميع", "ملاحظات محددة عن السلوك لا الشخص، مع اقتراح تحسين، في وقت ومكان مناسبين", "المجاملة الدائمة", "تجنب قول أي ملاحظة سلبية"], "a": 1, "e": "القاعدة: صف السلوك وأثره واقترح البديل: «التقرير وصل بعد الموعد مرتين، وهذا أخر الفريق، نتفق على تنبيه مبكر لو حصل تأخر؟» — لا أحكام شخصية ولا عموميات مثل «أنت مهمل»."}, {"q": "تلقيت نقدًا قاسيًا من مديرك أمام زملائك وتشعر أن جزءًا منه غير عادل. ماذا تفعل؟", "o": ["أرد بانفعال وأدافع فورًا أمام الجميع", "أمتص الموقف بهدوء، وأطلب لقاءً فرديًا لاحقًا لمناقشة النقاط بموضوعية", "أقدم استقالتي في اليوم نفسه", "أتجاهل الملاحظات كلها"], "a": 1, "e": "المناقشة الانفعالية العلنية نادرًا ما تخدمك. خذ ما في النقد من صواب، واطلب جلسة هادئة لتوضيح سوء الفهم بالحقائق. هذا يظهر نضجًا ولا يعني القبول الأعمى."}, {"q": "ما أفضل تحضير لمقابلة عمل قادمة؟", "o": ["الاعتماد على الارتجال", "دراسة الشركة والوظيفة، وتجهيز أمثلة STAR لإنجازاتي، والتدرب على الأسئلة الشائعة", "حفظ إجابات جاهزة من الإنترنت حرفيًا", "الاهتمام بالملابس فقط"], "a": 1, "e": "التحضير الجاد: اقرأ عن الشركة ومنتجاتها وأخبارها، طابق مهاراتك مع متطلبات الإعلان، جهز 4-6 قصص إنجاز بأسلوب STAR، وجهز أسئلة ذكية تسألها أنت في النهاية."}, {"q": "في نهاية المقابلة سألوك: «هل لديك أسئلة لنا؟» — ما الأفضل؟", "o": ["«لا، شكرًا، كل شيء واضح»", "أسئلة ذكية عن طبيعة النجاح في الدور والفريق وأولويات أول 90 يومًا", "أسأل عن الإجازات والراتب فقط", "أسأل أسئلة شخصية عن المدير"], "a": 1, "e": "سؤالك يكشف اهتمامك الحقيقي: «كيف تقيسون نجاح شاغل هذا الدور بعد 6 أشهر؟» سؤال يميزك. «لا أسئلة» توحي بفتور، وحصر الحديث في المميزات يترك انطباعًا ضيقًا."}, {"q": "ما المقصود بمهارة إدارة الوقت؟ وما أشهر أداة لها؟", "o": ["العمل ليلًا لتعويض النهار", "تخطيط اليوم بأولويات واضحة وتقسيم المهام الكبيرة، وأشهر الأدوات قائمة مهام ومصفوفة أيزنهاور", "الاستغناء عن النوم", "تعدد المهام المستمر"], "a": 1, "e": "إدارة الوقت تبدأ بمعرفة أين يذهب وقتك، ثم تخطيط اليوم بثلاث أولويات قصوى، وتقسيم المهام الكبيرة لخطوات. تعدد المهام المستمر ثبت أنه يقلل التركيز والجودة."}, {"q": "عندما يخطئ عميل في حقك ويتهمك بالتقصير ظلمًا، ما التصرف المهني؟", "o": ["أثبت غلطه بحدة لأنني المظلوم", "أستمع كاملًا دون مقاطعة، أعتذر عن انزعاجه، ثم أوضح الحقائق بهدوء وأقدم حلًا", "أتجاهل رسائله حتى يهدأ", "أحوله لزميل فورًا"], "a": 1, "e": "الغاضب يحتاج أولًا أن يُسمع. الاستماع ثم الاعتذار عن المشاعر (لا عن خطأ لم يحدث) يهدئ الموقف، وبعدها تعرض الحقائق والحل. الهدف حل المشكلة لا الفوز بالجدال."}, {"q": "ما الفرق بين القائد والمدير؟", "o": ["لا فرق إطلاقًا", "المدير يدير العمليات والصلاحيات، والقائد يلهم الناس ويؤثر فيهم ولو بلا منصب", "القائد أعلى راتبًا دائمًا", "المدير لا يحتاج مهارات"], "a": 1, "e": "الإدارة وظيفة وصلاحيات، والقيادة سلوك: التأثير والإلهام وتحمل المسؤولية. يمكن أن تقود من أي موقع بمبادرتك ومثالك، ويمكن أن يكون مدير بلا صفات قيادية."}, {"q": "كيف تتعامل مع زميل لا ينجز جزءه من عمل مشترك فيقترب موعد التسليم؟", "o": ["أنجز جزءه بصمت كل مرة", "أتحدث معه مباشرة لأفهم السبب وأعرض المساعدة، وإن تكرر أوضحت الأثر ورفعت الأمر للمسؤول بالحقائق", "أفضحه في مجموعة العمل", "أنسحب من المشروع"], "a": 1, "e": "الحوار المباشر أولًا: ربما يواجه عائقًا لا تعرفه. إن تكرر الإهمال، احمِ العمل بتصعيد مهني موثق للمسؤول. الإنجاز الدائم بالنيابة يكافئ التقصير ويرهقك."}, {"q": "ما أفضل صيغة لرفض مهمة إضافية وأنت مثقل فعلًا؟", "o": ["«لا» جافة فقط", "قبول كل شيء ثم التقصير في الكل", "«جدولي ممتلئ بمهام س وص حتى الخميس، أقدر أبدأ هذه الجمعة، أو نراجع أولوية المهام معًا؟»", "التظاهر بالمرض"], "a": 2, "e": "الرفض الاحترافي يقدم بديلًا: توقيتًا لاحقًا أو إعادة ترتيب أولويات بمشاركة المدير. هكذا تحمي جودة عملك دون أن تبدو متعاونًا."}, {"q": "ما المقصود بالتعلم المستمر في سوق العمل الحالي؟", "o": ["الحصول على شهادة واحدة تكفي مدى الحياة", "تطوير المهارات باستمرار لأن متطلبات الوظائف والأدوات تتغير بسرعة", "حفظ معلومات عامة فقط", "قراءة الأخبار يوميًا"], "a": 1, "e": "نصف عمر المهارات المهنية يتناقص باستمرار، والأدوات تتجدد كل بضع سنوات. من يخصص وقتًا أسبوعيًا منتظمًا للتعلم يحافظ على قيمته السوقية ويُفتح له فرص أفضل."}, {"q": "في اجتماع، لديك فكرة جيدة لكن زملاء أقدم يميلون لرأي آخر. ماذا تفعل؟", "o": ["أصمت احترامًا للأقدمية", "أطرح فكرتي بأدب مع بيان مزاياها وأقبل قرار الفريق النهائي بروح رياضية", "أصر على رأيي حتى النهاية", "أروج لفكرتي خارج الاجتماع سرًا"], "a": 1, "e": "قيمة الفكرة لا ترتبط بأقدمية صاحبها. اعرضها بالمنطق والفائدة، واستمع للاعتراضات فقد تحسّنها. بعد القرار الجماعي، ادعمه حتى لو خالف رأيك."}, {"q": "ما المقصود بثقافة الاعتذار المهني عند الخطأ؟", "o": ["الاعتذار ضعف يجب تجنبه", "الاعتراف السريع بالخطأ مع خطة تصحيح يحفظ الثقة أكثر من الإنكار", "الاعتذار المتكرر عن كل شيء", "لوم الظروف دائمًا"], "a": 1, "e": "الخطأ البشري مقبول، والإنكار هو ما يهدم الثقة. الصيغة الناضجة: «حدث خطأ في كذا، أثره كذا، سأصححه بكذا وسأضع إجراءً يمنع تكراره»."}, {"q": "كيف تحافظ على التوازن بين العمل والحياة الشخصية؟", "o": ["العمل المتواصل دليل الإخلاص", "حدود واضحة لوقت العمل، وراحة منتظمة، لأن الإرهاق المزمن يقلل الإنتاجية ويضر الصحة", "إهمال العمل بحجة الراحة", "عدم أخذ إجازات أبدًا"], "a": 1, "e": "الاحتراق الوظيفي (Burnout) يقلل جودة العمل ويضر الصحة والعلاقات. الحدود الواضحة والراحة والنوم استثمار في أدائك، وليست كسلًا."}, {"q": "عرض عليك زميل استخدام «حيلة» غير نظامية لتسريع معاملة رسمية. ما التصرف؟", "o": ["أوافق، فالجميع يفعل ذلك", "أرفض بهدوء وألتزم بالمسار النظامي، فالمخالفة قد تكلفني وظيفتي وسمعتي", "أوافق سرًا وأنكر لو اكتُشفت", "أبلغ عنه فورًا دون كلام"], "a": 1, "e": "المخالفات الصغيرة تتدرج، وثمن اكتشافها (فصل، مساءلة قانونية) أكبر بكثير من توفير وقت. التزامك بالنظام يحميك على المدى الطويل ويبني سمعة موثوقية."}, {"q": "ما أهم ما يجب أن تحتويه رسالة التقديم لوظيفة (Cover Letter)؟", "o": ["نسخ السيرة الذاتية نفسها", "لماذا أنت مناسب لهذه الوظيفة تحديدًا في هذه الشركة تحديدًا، بإنجازات ملموسة", "قصة حياتك الشخصية", "مطالبك المادية بالتفصيل"], "a": 1, "e": "الرسالة المخصصة لكل وظيفة تربط مهاراتك باحتياجهم الفعلي الم const N = 10;
let bank = [], qs = [], i = 0, score = 0, cur = '';

async function start(section) {
  cur = section;
  bank = BANKS[section];
  qs = shuffle(bank).slice(0, Math.min(N, bank.length)).map(q => {
    const order = shuffle(q.o.map((_, idx) => idx));
    return {...q, o: order.map(idx => q.o[idx]), a: order.indexOf(q.a)};
  });
  i = 0; score = 0;
  show('quiz');
  render();
}
function shuffle(items) {
  const a = items.slice();
  for (let j = a.length - 1; j > 0; j--) {
    const k = Math.floor(Math.random() * (j + 1));
    [a[j], a[k]] = [a[k], a[j]];
  }
  return a;
}
function show(id) {
  ['home','quiz','result'].forEach(x => document.getElementById(x).style.display = x === id ? '' : 'none');
}
function render() {
  const q = qs[i];
  document.getElementById('counter').textContent = 'سؤال ' + (i+1) + ' من ' + qs.length;
  document.getElementById('running').textContent = 'صحيحة حتى الآن: ' + score;
  document.getElementById('prog').style.width = (i / qs.length * 100) + '%';
  document.getElementById('qtext').textContent = q.q;
  const box = document.getElementById('opts');
  box.innerHTML = '';
  q.o.forEach((t, idx) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = t;
    b.onclick = () => answer(idx, b);
    box.appendChild(b);
  });
  const why = document.getElementById('why');
  why.className = 'why'; why.innerHTML = '';
  const nb = document.getElementById('nextbtn');
  nb.className = 'next';
}
function answer(idx, btn) {
  const q = qs[i];
  const opts = document.querySelectorAll('#opts .opt');
  opts.forEach(o => o.disabled = true);
  opts[q.a].classList.add('right');
  let head;
  if (idx === q.a) { score++; head = '✅ إجابة صحيحة!'; }
  else { btn.classList.add('wrong'); head = '❌ إجابة غير صحيحة. الصحيح: «' + q.o[q.a] + '»'; }
  const why = document.getElementById('why');
  why.innerHTML = '<b>' + head + '</b><br>' + q.e;
  why.classList.add('show');
  document.getElementById('running').textContent = 'صحيحة حتى الآن: ' + score;
  const nb = document.getElementById('nextbtn');
  nb.textContent = (i + 1 < qs.length) ? 'السؤال التالي' : 'عرض النتيجة';
  nb.classList.add('show');
}
function next() {
  if (i + 1 < qs.length) { i++; render(); }
  else {
    document.getElementById('prog').style.width = '100%';
    document.getElementById('scorenum').textContent = score + ' من ' + qs.length;
    const p = score / qs.length;
    let m;
    if (p >= .9) m = 'ممتاز! مستواك قوي جدًا في هذا القسم 🌟';
    else if (p >= .7) m = 'جيد جدًا — راجع الأسئلة اللي غلطت فيها وهتتقن القسم 💪';
    else if (p >= .5) m = 'أساس كويس — أعد المحاولة وركّز على الشروحات 📚';
    else m = 'بداية طيبة — اقرأ الشروحات بتمعن وحاول مرة أخرى، التكرار يعلّم 🔁';
    document.getElementById('scoremsg').textContent = m;
    show('result');
  }
}
function restart(same) { if (same) start(cur); else show('home'); }
